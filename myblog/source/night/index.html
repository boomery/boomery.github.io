  <script>
window.NightSave = {
  API: 'https://gallery-api.boomery.top/api/night-saves',
  timer: null,
  latest: null,
  parsePayload: function (payload) {
    if (typeof payload === 'string') {
      try { payload = JSON.parse(payload); } catch (err) { return {}; }
    }
    return payload && typeof payload === 'object' ? payload : {};
  },
  invoke: function (cb, result) {
    var json = typeof result === 'string' ? result : JSON.stringify(result);
    var targets = [];
    if (cb) targets.push(cb);
    if (window._nightSaveCb && window._nightSaveCb !== cb) targets.push(window._nightSaveCb);
    for (var i = 0; i < targets.length; i++) {
      try { targets[i](json); } catch (err) {}
    }
  },
  queuePut: function (token, payload) {
    var pack = { token: token, payload: this.parsePayload(payload) };
    this.latest = pack;
    clearTimeout(this.timer);
    var self = this;
    this.timer = setTimeout(function () { self.put(pack.token, pack.payload); }, 2200);
  },
  put: function (token, payload, cb) {
    var body = this.parsePayload(payload);
    var self = this;
    return fetch(this.API, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        active_slot: body.active_slot,
        slots: body.slots
      })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        var result = { ok: r.ok && data.ok !== false, error: data.error || '', status: r.status };
        if (result.ok && self.latest && self.latest.token === token) self.latest = null;
        self.invoke(cb, result);
        return result;
      });
    }).catch(function (err) {
      var result = { ok: false, error: String(err) };
      self.invoke(cb, result);
      return result;
    });
  },
  get: function (token, cb) {
    var self = this;
    return fetch(this.API + '?token=' + encodeURIComponent(token)).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        var result = Object.assign({ ok: r.ok && data.ok !== false, error: data.error || '', status: r.status }, data);
        self.invoke(cb, result);
        return result;
      });
    }).catch(function (err) {
      var result = { ok: false, error: String(err) };
      self.invoke(cb, result);
      return result;
    });
  },
  copy: function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    }
  },
  flush: function () {
    if (!this.latest) return;
    var pack = this.latest;
    this.put(pack.token, pack.payload);
  }
};
window.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') window.NightSave.flush();
});
window.addEventListener('pagehide', function () {
  window.NightSave.flush();
});

const NIGHT_GAME_VERSION = '0.19.2';
const NIGHT_BUILT_AT = '2026-09-23 21:31';
const NIGHT_PCK = 'https://cdn.boomery.top/night.pck?v=0.19.2-157068568';
(function stampBuildMeta() {
  const ver = document.getElementById('nightGameVer');
  const built = document.getElementById('nightBuiltAt');
  if (ver) ver.textContent = 'v' + NIGHT_GAME_VERSION;
  if (built) {
    built.textContent = NIGHT_BUILT_AT;
    built.setAttribute('datetime', NIGHT_BUILT_AT.replace(' ', 'T') + '+08:00');
  }
})();
const GODOT_CONFIG = {
  args: [],
  canvasResizePolicy: 2,
  emscriptenPoolSize: 8,
  ensureCrossOriginIsolationHeaders: false,
  executable: 'night',
  mainPack: NIGHT_PCK,
  experimentalVK: false,
  fileSizes: {
    'night.pck': 157068568,
    'night.wasm': 39514754
  },
  focusCanvas: true,
  gdextensionLibs: []
};
if (NIGHT_PCK !== 'night.pck') {
  GODOT_CONFIG.fileSizes[NIGHT_PCK] = 157068568;
}
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=' + GODOT_CONFIG.fileSizes[NIGHT_PCK] + '-' + NIGHT_GAME_VERSION, { updateViaCache: 'none' });
}

(function () {
  const statusOverlay = document.getElementById('status');
  const statusProgress = document.getElementById('status-progress');
  const statusNotice = document.getElementById('status-notice');
  const enterBtn = document.getElementById('enterBtn');
  const gate = document.getElementById('gate');
  const backFab = document.getElementById('backFab');
  const gateLoad = document.getElementById('gateLoad');
  const gateBar = document.getElementById('gateBar');
  const gateLoadText = document.getElementById('gateLoadText');

  const gateNote = document.getElementById('gateNote');

  let initializing = true;
  let statusMode = '';
  let packCached = false;
  let packStale = false;
  let gatePhase = 'idle';
  let holdLabel = '';
  let packStore = Promise.resolve();
  let gamePack = null;
  const PACK_CACHE = 'night-pck-' + NIGHT_GAME_VERSION + '-' + GODOT_CONFIG.fileSizes[NIGHT_PCK];

  async function localPack() {
    if (!('caches' in window)) return null;
    try {
      const cache = await caches.open(PACK_CACHE);
      const cached = await cache.match(NIGHT_PCK);
      if (!cached) return null;
      const expected = GODOT_CONFIG.fileSizes[NIGHT_PCK];
      const len = Number(cached.headers.get('Content-Length')) || 0;
      const ver = cached.headers.get('X-Night-Version') || '';
      if (expected && len && len !== expected) return null;
      if (ver && ver !== NIGHT_GAME_VERSION) return null;
      return cached;
    } catch (err) {
      return null;
    }
  }

  async function hasOtherPackCache() {
    if (!('caches' in window)) return false;
    try {
      const keys = await caches.keys();
      return keys.some(function (key) {
        return key.indexOf('night-pck-') === 0 && key !== PACK_CACHE;
      });
    } catch (err) {
      return false;
    }
  }

  async function purgeOldPacks() {
    if (!('caches' in window)) return;
    try {
      const keys = await caches.keys();
      await Promise.all(keys.filter(function (key) {
        return key.indexOf('night-pck-') === 0 && key !== PACK_CACHE;
      }).map(function (key) {
        return caches.delete(key);
      }));
    } catch (err) {}
  }

  async function markCachedPack() {
    const cached = await localPack();
    packCached = !!cached;
    packStale = !packCached && await hasOtherPackCache();
    if (!gateNote) return;
    if (packCached) {
      gateNote.textContent = '游戏文件已缓存在本机，再次启程无需下载';
    } else if (packStale) {
      gateNote.textContent = '游戏已更新至 v' + NIGHT_GAME_VERSION + '，启程时将重新下载约 ' + formatMB(GODOT_CONFIG.fileSizes[NIGHT_PCK]);
    }
  }

  async function waitForWorker(ms) {
    if (!('serviceWorker' in navigator)) return;
    const ctrl = navigator.serviceWorker.controller;
    if (!ctrl || (ctrl.scriptURL || '').indexOf(NIGHT_GAME_VERSION) !== -1) return;
    try {
      await Promise.race([
        new Promise(function (resolve) {
          navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        }),
        new Promise(function (resolve) { setTimeout(resolve, ms); }),
      ]);
    } catch (err) {}
  }

  function yieldPaint() {
    if (typeof scheduler !== 'undefined' && typeof scheduler.yield === 'function') return scheduler.yield();
    return new Promise(function (resolve) {
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        resolve();
      }
      requestAnimationFrame(function () { setTimeout(finish, 0); });
      setTimeout(finish, 48);
    });
  }

  function showBusy(text) {
    holdLabel = text || '请稍候…';
    if (bootTimer) {
      clearInterval(bootTimer);
      bootTimer = null;
    }
    gateLoad.classList.remove('is-error', 'is-ready', 'is-indeterminate');
    gateLoad.classList.add('is-on', 'is-booting');
    gateBar.style.width = '';
    gateLoadText.textContent = holdLabel;
  }

  async function readBody(res, onBytes, expected) {
    const hinted = Number(res.headers.get('Content-Length')) || expected || 0;
    if (!res.body || !res.body.getReader) {
      const buf = await res.arrayBuffer();
      holdLabel = '';
      onBytes(buf.byteLength || hinted);
      return buf;
    }
    const reader = res.body.getReader();
    const chunks = [];
    let loaded = 0;
    let frameBudget = performance.now() + 12;
    for (;;) {
      const step = await reader.read();
      if (step.done) break;
      holdLabel = '';
      chunks.push(step.value);
      loaded += step.value.byteLength;
      if (performance.now() >= frameBudget) {
        onBytes(loaded);
        await yieldPaint();
        frameBudget = performance.now() + 12;
      }
    }
    onBytes(Math.max(loaded, hinted));
    if (!loaded) return new ArrayBuffer(0);
    if (chunks.length === 1) {
      const only = chunks[0];
      const owned = only.byteOffset === 0 && only.byteLength === only.buffer.byteLength;
      if (owned && (!expected || only.byteLength === expected)) return only.buffer;
    }
    const buf = await concatChunks(chunks);
    holdLabel = '';
    onBytes(buf.byteLength);
    return buf;
  }

  function allocPack(size) {
    var source = 'self.onmessage=function(ev){var bytes=new Uint8Array(ev.data);self.postMessage(bytes.buffer,[bytes.buffer]);};';
    return new Promise(function (resolve) {
      var url = '';
      var worker = null;
      try {
        url = URL.createObjectURL(new Blob([source], { type: 'application/javascript' }));
        worker = new Worker(url);
      } catch (err) {
        if (url) URL.revokeObjectURL(url);
        resolve(new Uint8Array(size));
        return;
      }
      worker.onmessage = function (ev) {
        worker.terminate();
        URL.revokeObjectURL(url);
        resolve(new Uint8Array(ev.data));
      };
      worker.onerror = function () {
        worker.terminate();
        URL.revokeObjectURL(url);
        resolve(new Uint8Array(size));
      };
      worker.postMessage(size);
    });
  }

  async function concatChunks(chunks) {
    var total = 0;
    for (var i = 0; i < chunks.length; i++) total += chunks[i].byteLength;
    showBusy('正在整理行囊…');
    await yieldPaint();
    var bytes = await allocPack(total);
    var offset = 0;
    var frameBudget = performance.now() + 12;
    for (var c = 0; c < chunks.length; c++) {
      var chunk = chunks[c];
      var off = 0;
      while (off < chunk.byteLength) {
        var n = Math.min(256 * 1024, chunk.byteLength - off);
        bytes.set(chunk.subarray(off, off + n), offset);
        offset += n;
        off += n;
        if (performance.now() >= frameBudget) {
          await yieldPaint();
          frameBudget = performance.now() + 12;
        }
      }
      chunks[c] = null;
    }
    return bytes.buffer;
  }

  async function loadPack(onBytes) {
    const expected = GODOT_CONFIG.fileSizes[NIGHT_PCK];
    const reading = packCached
      ? '正在从本机读取行囊…'
      : (packStale ? '发现新版本，正在重新下载…' : '正在装载行囊…');
    showBusy(reading);
    await yieldPaint();
    const cached = await localPack();
    if (cached) {
      const buf = await readBody(cached, onBytes, expected);
      if (!expected || buf.byteLength === expected) return buf;
    }
    await purgeOldPacks();
    showBusy(packStale ? '发现新版本，正在重新下载…' : '正在装载行囊…');
    await yieldPaint();
    const res = await fetch(NIGHT_PCK, { mode: 'cors', cache: 'no-store' });
    if (!res.ok) throw new Error('游戏包 night.pck 未能加载（HTTP ' + res.status + '）');
    const buf = await readBody(res, onBytes, expected);
    if (expected && buf.byteLength !== expected) {
      throw new Error('行囊体积不符（' + buf.byteLength + ' / ' + expected + '），CDN 可能仍是旧包，请稍后刷新重试。');
    }
    gamePack = buf;
    return buf;
  }

  async function storePack(buf) {
    if (!('caches' in window) || !buf) return;
    try {
      const cache = await caches.open(PACK_CACHE);
      await cache.put(NIGHT_PCK, new Response(new Blob([buf]), {
        headers: {
          'Content-Type': 'application/octet-stream',
          'Content-Length': String(buf.byteLength),
          'X-Night-Version': NIGHT_GAME_VERSION,
        },
      }));
      await purgeOldPacks();
    } catch (err) {
      console.warn('夜行镖行囊未能写入本机缓存', err);
    }
  }

  function formatMB(bytes) {
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  markCachedPack();

  let bootTimer = null;

  function stopBootHints() {
    if (bootTimer) {
      clearInterval(bootTimer);
      bootTimer = null;
    }
    gateLoad.classList.remove('is-booting', 'is-entering');
  }

  function setEnterLabel(text) {
    enterBtn.innerHTML = '<span>' + text + '</span><span class="gate-btn__arrow" aria-hidden="true">⟶</span>';
  }

  function showReadyToStart() {
    holdLabel = '';
    stopBootHints();
    gateLoad.classList.remove('is-indeterminate', 'is-booting', 'is-error');
    gateLoad.classList.add('is-on', 'is-ready');
    gateBar.style.width = '100%';
    gateLoadText.textContent = '行囊已就绪。听完这阵雨，再入夜。';
    enterBtn.classList.remove('is-hidden');
    enterBtn.disabled = false;
    setEnterLabel('开始游戏');
    gatePhase = 'ready';
    packStore.then(function () {
      if (gatePhase === 'ready' && window.NightGateAtmosphere && window.NightGateAtmosphere.restore) {
        window.NightGateAtmosphere.restore();
      }
    });
  }

  function showGateProgress() {
    holdLabel = '';
    stopBootHints();
    enterBtn.classList.add('is-hidden');
    gateLoad.classList.remove('is-error', 'is-ready');
    gateLoad.classList.add('is-on', 'is-indeterminate');
    gateBar.style.width = '';
    if (packCached) {
      gateLoadText.textContent = '正在从本机读取行囊…';
    } else if (packStale) {
      gateLoadText.textContent = '发现新版本，正在重新下载…';
    } else {
      gateLoadText.textContent = '正在装载行囊…';
    }
  }

  function updateGateProgress(current, total) {
    if (holdLabel) return;
    if (!(current > 0 && total > 0)) {
      gateLoad.classList.add('is-indeterminate');
      return;
    }
    const pct = Math.min(100, Math.round((current / total) * 100));
    gateLoad.classList.remove('is-indeterminate', 'is-booting');
    gateBar.style.width = pct + '%';
    const label = packCached ? '本机读取 ' : (packStale ? '更新中 ' : '装载中 ');
    gateLoadText.textContent = label + pct + '% · ' + formatMB(current) + ' / ' + formatMB(total);
  }

  function setStatusMode(mode) {
    if (statusMode === mode || !initializing) return;
    if (mode === 'hidden') {
      statusOverlay.remove();
      initializing = false;
      return;
    }
    statusOverlay.style.visibility = 'visible';
    statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
    statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
    statusMode = mode;
  }

  function setStatusNotice(text) {
    while (statusNotice.lastChild) {
      statusNotice.removeChild(statusNotice.lastChild);
    }
    const lines = text.split('\n');
    lines.forEach((line) => {
      statusNotice.appendChild(document.createTextNode(line));
      statusNotice.appendChild(document.createElement('br'));
    });
  }

  function displayFailureNotice(err) {
    holdLabel = '';
    if (window.NightGateAtmosphere && window.NightGateAtmosphere.restore) window.NightGateAtmosphere.restore();
    console.error(err);
    let message = 'An unknown error occurred.';
    if (err instanceof Error) message = err.message;
    else if (typeof err === 'string') message = err;
    if (/404|failed to fetch|load/i.test(message)) {
      message = '行囊暂未送达，请检查网络后重试。已下载的缓存会尽量保留。';
    }
    stopBootHints();
    gate.classList.remove('is-gone');
    gateLoad.classList.add('is-on', 'is-error');
    gateLoad.classList.remove('is-indeterminate', 'is-booting', 'is-entering', 'is-ready');
    gateBar.style.width = '0';
    gateLoadText.textContent = message;
    enterBtn.classList.remove('is-hidden');
    enterBtn.disabled = false;
    setEnterLabel('重试');
    gatePhase = 'idle';
    setStatusNotice(message);
    setStatusMode('notice');
    initializing = false;
  }

  async function pckExists() {
    if (await localPack()) return true;
    try {
      const res = await fetch(NIGHT_PCK, { method: 'HEAD' });
      return res.ok;
    } catch (err) {
      return false;
    }
  }

  async function startGodot() {
    const missing = Engine.getMissingFeatures({
      threads: GODOT_THREADS_ENABLED,
    });

    if (missing.length !== 0) {
      const missingMsg = 'Error\n当前浏览器缺少运行 Godot 网页版所需的能力：\n';
      displayFailureNotice(missingMsg + missing.join('\n'));
      return;
    }

    setStatusMode('progress');
    const pckSize = GODOT_CONFIG.fileSizes[NIGHT_PCK];
    const wasmSize = GODOT_CONFIG.fileSizes['night.wasm'];
    let pckLoaded = 0;
    let wasmLoaded = 0;

    function report() {
      const current = pckLoaded + wasmLoaded;
      const total = pckSize + wasmSize;
      updateGateProgress(current, total);
      if (current > 0 && total > 0) {
        statusProgress.value = current;
        statusProgress.max = total;
      }
    }

    try {
      gamePack = null;
      engine.config.update({
        onProgress: function (current) {
          wasmLoaded = current || 0;
          report();
        },
      });
      engine.config.args = ['--main-pack', NIGHT_PCK];
      const packPromise = loadPack(function (loaded) {
        pckLoaded = loaded;
        report();
      });
      const buf = (await Promise.all([packPromise, engine.init('night')]))[0];
      gamePack = buf;
      await engine.preloadFile(buf, NIGHT_PCK);
      showReadyToStart();
    } catch (err) {
      displayFailureNotice(err);
    }
  }

  function reportNightEntry(loaded, total) {
    if (!(total > 0)) return;
    const pct = Math.min(100, Math.round((loaded / total) * 100));
    holdLabel = '正在入夜';
    gateLoad.classList.remove('is-error', 'is-ready', 'is-indeterminate', 'is-booting');
    gateLoad.classList.add('is-on');
    gateBar.style.width = pct + '%';
    gateLoadText.textContent = '正在入夜 ' + pct + '%';
  }

  let readMeter = null;

  function stopReadMeter() {
    if (!readMeter) return;
    var meter = readMeter;
    readMeter = null;
    meter.stop();
  }

  function mountReadMeter() {
    stopReadMeter();
    var canvas = document.createElement('canvas');
    canvas.className = 'gate-load__meter';
    canvas.setAttribute('aria-hidden', 'true');
    gateLoad.appendChild(canvas);
    var cssW = Math.max(1, Math.round(gateLoad.clientWidth || 315));
    var cssH = Math.max(1, Math.round(gateLoad.clientHeight || 40));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    var source = [
      'var canvas,ctx,W,H,cssW;',
      'function draw(loaded,total){',
      'if(!ctx)return;',
      'ctx.clearRect(0,0,W,H);',
      'var dpr=W/cssW;',
      'var barH=Math.max(2,2*dpr);',
      'ctx.fillStyle="rgba(150,164,163,0.17)";',
      'ctx.fillRect(0,0,W,barH);',
      'var label="正在入夜…";',
      'if(total>0&&loaded>0){',
      'var pct=Math.max(0,Math.min(1,loaded/total));',
      'var grad=ctx.createLinearGradient(0,0,Math.max(1,W*pct),0);',
      'grad.addColorStop(0,"#78513c");',
      'grad.addColorStop(1,"#d5c19c");',
      'ctx.fillStyle=grad;',
      'ctx.fillRect(0,0,Math.max(1,W*pct),barH);',
      'label="正在入夜 "+Math.round(pct*100)+"%";',
      '}',
      'ctx.fillStyle="#bbc3c1";',
      'ctx.font=(11*dpr)+"px sans-serif";',
      'ctx.textBaseline="top";',
      'ctx.fillText(label,0,barH+12*dpr);',
      '}',
      'self.onmessage=function(ev){',
      'var data=ev.data||{};',
      'if(data.canvas){canvas=data.canvas;ctx=canvas.getContext("2d");W=data.w;H=data.h;cssW=data.cssW;draw(0,0);return;}',
      'draw(data.loaded||0,data.total||0);',
      '};'
    ].join('');
    var url = '';
    var worker = null;
    try {
      url = URL.createObjectURL(new Blob([source], { type: 'application/javascript' }));
      worker = new Worker(url);
      var offscreen = canvas.transferControlToOffscreen();
      worker.postMessage({ canvas: offscreen, w: canvas.width, h: canvas.height, cssW: cssW }, [offscreen]);
    } catch (err) {
      if (worker) worker.terminate();
      if (url) URL.revokeObjectURL(url);
      canvas.remove();
      readMeter = {
        push: function (loaded, total) { reportNightEntry(loaded, total); },
        stop: function () {}
      };
      return;
    }
    gateLoad.classList.add('is-meter');
    readMeter = {
      push: function (loaded, total) {
        reportNightEntry(loaded, total);
        try { worker.postMessage({ loaded: loaded, total: total }); } catch (err) {}
      },
      stop: function () {
        try { worker.terminate(); } catch (err) {}
        if (url) URL.revokeObjectURL(url);
        canvas.remove();
        gateLoad.classList.remove('is-meter');
      }
    };
  }

  async function launchGame() {
    showBusy('正在入夜…');
    enterBtn.classList.add('is-hidden');
    mountReadMeter();
    window.NightPackRead = function (loaded, total) {
      if (readMeter) readMeter.push(loaded, total);
    };
    await yieldPaint();
    if (window.NightGateAtmosphere) window.NightGateAtmosphere.stop();
    try {
      await engine.start();
      if (gamePack && !packCached) {
        const saving = gamePack;
        gamePack = null;
        packStore = storePack(saving);
      } else {
        gamePack = null;
      }
      stopBootHints();
      setStatusMode('hidden');
      gate.classList.add('is-gone');
      markCachedPack();
    } catch (err) {
      displayFailureNotice(err);
    } finally {
      window.NightPackRead = null;
      stopReadMeter();
    }
  }

  enterBtn.addEventListener('click', async function () {
    if (gatePhase === 'ready') {
      gatePhase = 'launching';
      enterBtn.disabled = true;
      await launchGame();
      return;
    }
    if (gatePhase !== 'idle') return;
    gatePhase = 'loading';
    initializing = true;
    statusMode = '';
    enterBtn.disabled = true;
    if (window.NightGateAtmosphere && window.NightGateAtmosphere.ease) window.NightGateAtmosphere.ease();
    backFab.classList.add('is-on');
    showGateProgress();
    await waitForWorker(4000);
    await markCachedPack();
    const ready = await pckExists();
    if (!ready) {
      displayFailureNotice('行囊暂未送达，请检查网络后重试。');
      return;
    }
    startGodot();
  });
}());
  </script>
