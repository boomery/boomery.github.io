<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>槐安夜雨 · 夜行镖</title>
  <meta name="description" content="boomery 的暗黑武侠 Web 游戏：夜行镖 · 槐安夜雨。开场直入旧渡口。">
  <link rel="icon" type="image/png" href="night.icon.png">
  <link rel="apple-touch-icon" href="night.apple-touch-icon.png">
  <link rel="preload" href="art/ferry-night.webp" as="image" fetchpriority="high">
  <link rel="preload" href="fonts/night-calligraphy.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="gate.css">
</head>
<body>
  <main class="gate" id="gate" aria-label="槐安夜雨游戏入口">
    <div class="gate-world" aria-hidden="true">
      <img class="gate-scene" id="gateScene" src="art/ferry-night.webp" alt="" fetchpriority="high">
      <div class="gate-cloudlight" id="gateCloudlight"></div>
      <svg class="gate-lightning" id="gateLightning" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <defs><filter id="lightningGlow" x="-100%" y="-30%" width="300%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
        <g class="lightning-branches" fill="none" stroke-linejoin="round">
          <path d="M1016 -20 998 28 1007 39 982 79 986 87 959 125 975 117 947 170 953 179 921 235 929 216 903 260"/>
          <path class="lightning-twig" d="m984 79 33 20 6 25 27 23 9 32 m-111 -10 -30 11 -7 18 -29 7"/>
        </g>
      </svg>
      <div class="gate-mist gate-mist--far"></div>
      <div class="gate-mist gate-mist--near"></div>
      <div class="gate-rainfall" id="gateRainfall"></div>
      <canvas class="gate-glass" id="rainBg"></canvas>
      <div class="gate-veil"></div>
      <div class="gate-flash" id="gateFlash"></div>
      <div class="gate-grain"></div>
    </div>
    <nav class="gate-nav" aria-label="入口导航">
      <a class="gate-brand" href="/" aria-label="返回 boomery 首页">
        <span class="gate-brand__seal" aria-hidden="true">夜</span>
        <span>夜行镖<small>A BOOMERY GAME</small></span>
      </a>
      <div class="gate-nav-right">
        <a class="gate-space" href="/space/">数字空间 <span aria-hidden="true">↗</span></a>
        <span class="gate-nav-divider" aria-hidden="true"></span>
        <button class="gate-weather" id="gateWeather" type="button" aria-pressed="true" aria-label="雷雨动态效果">雷雨 <span id="weatherState">开</span></button>
        <button class="gate-sound" id="gateSound" type="button" aria-pressed="false" aria-label="环境声音">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span id="soundLabel">听雨</span>
        </button>
      </div>
    </nav>
    <section class="gate-card" aria-labelledby="gateTitle">
      <p class="gate-kicker"><span></span>一段未了的江湖旧事</p>
      <div class="gate-title-wrap">
        <h1 id="gateTitle"><span>槐安</span><span>夜雨</span></h1>
        <span class="gate-title-seal" aria-label="夜行镖">夜<br>行<br>镖</span>
      </div>
      <p class="gate-tagline">雨未歇，旧仇未了。</p>
      <p class="gate-story">七年前，一场夜雨，一趟血镖。<br>七年后，重回旧渡，问剑故人。</p>
      <div class="gate-actions">
        <span class="gate-btn-wrap rain-surface" id="enterWrap">
          <button class="gate-btn" id="enterBtn" type="button"><span>即刻启程</span><span class="gate-btn__arrow" aria-hidden="true">⟶</span></button>
          <span class="surface-water" aria-hidden="true"></span>
        </span>
        <div class="gate-load" id="gateLoad" role="status" aria-live="polite">
          <div class="gate-load__track"><div class="gate-load__bar" id="gateBar"></div></div>
          <p class="gate-load__text" id="gateLoadText">正在装载行囊…</p>
        </div>
        <p class="gate-note" id="gateNote">首次启程约需下载 178 MB · 支持本机缓存</p>
      </div>
    </section>
    <aside class="gate-poem" aria-label="雨夜题记"><span>一身风雨</span><span>半生恩仇</span></aside>
    <div class="gate-chapter rain-surface">
      <span class="chapter-number">壹</span>
      <span class="chapter-title">旧渡口<small>故事，自此入夜</small></span>
      <span class="chapter-line" aria-hidden="true"></span>
      <span class="surface-water" aria-hidden="true"></span>
    </div>
    <footer class="gate-footer">
      <p class="gate-meta"><span id="nightGameVer">v0.19.1</span><span class="meta-dot">·</span><time id="nightBuiltAt">2026-09-22 16:20</time></p>
      <p class="gate-listen" id="gateListen">轻触画面，听雨入夜</p>
      <a class="gate-engine" href="https://godotengine.org" target="_blank" rel="noopener">MADE WITH GODOT <span aria-hidden="true">↗</span></a>
    </footer>
  </main>

  <a class="back-fab" id="backFab" href="/night/">← 返回</a>

  <canvas id="canvas">
    Your browser does not support the canvas tag.
  </canvas>

  <noscript>需要启用 JavaScript 才能运行这款游戏。</noscript>

  <div id="status">
    <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="night.icon.png" alt="">
    <progress id="status-progress"></progress>
    <div id="status-notice"></div>
  </div>

  <script src="vendor/howler.min.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/raindrop-fx.js"></script>
  <script src="gate-atmosphere.js"></script>
  <script src="night.js"></script>
  <script>
window.NightSave = {
  API: 'https://gallery-api.boomery.top/api/night-saves',
  timer: null,
  latest: null,
  parsePayload: function (payload) {
    if (typeof payload === 'string') {
      try { payload = JSON.parse(payload); } catch (err) { return {}; }
    }
    return payload && typeof payload === 'object' ? payload : {};
  },
  invoke: function (cb, result) {
    var json = typeof result === 'string' ? result : JSON.stringify(result);
    var targets = [];
    if (cb) targets.push(cb);
    if (window._nightSaveCb && window._nightSaveCb !== cb) targets.push(window._nightSaveCb);
    for (var i = 0; i < targets.length; i++) {
      try { targets[i](json); } catch (err) {}
    }
  },
  queuePut: function (token, payload) {
    var pack = { token: token, payload: this.parsePayload(payload) };
    this.latest = pack;
    clearTimeout(this.timer);
    var self = this;
    this.timer = setTimeout(function () { self.put(pack.token, pack.payload); }, 2200);
  },
  put: function (token, payload, cb) {
    var body = this.parsePayload(payload);
    var self = this;
    return fetch(this.API, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        active_slot: body.active_slot,
        slots: body.slots
      })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        var result = { ok: r.ok && data.ok !== false, error: data.error || '', status: r.status };
        if (result.ok && self.latest && self.latest.token === token) self.latest = null;
        self.invoke(cb, result);
        return result;
      });
    }).catch(function (err) {
      var result = { ok: false, error: String(err) };
      self.invoke(cb, result);
      return result;
    });
  },
  get: function (token, cb) {
    var self = this;
    return fetch(this.API + '?token=' + encodeURIComponent(token)).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        var result = Object.assign({ ok: r.ok && data.ok !== false, error: data.error || '', status: r.status }, data);
        self.invoke(cb, result);
        return result;
      });
    }).catch(function (err) {
      var result = { ok: false, error: String(err) };
      self.invoke(cb, result);
      return result;
    });
  },
  copy: function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    }
  },
  flush: function () {
    if (!this.latest) return;
    var pack = this.latest;
    this.put(pack.token, pack.payload);
  }
};
window.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') window.NightSave.flush();
});
window.addEventListener('pagehide', function () {
  window.NightSave.flush();
});

const NIGHT_GAME_VERSION = '0.19.1';
const NIGHT_BUILT_AT = '2026-09-22 17:10';
const NIGHT_PCK = 'https://cdn.boomery.top/night.pck';
(function stampBuildMeta() {
  const ver = document.getElementById('nightGameVer');
  const built = document.getElementById('nightBuiltAt');
  if (ver) ver.textContent = 'v' + NIGHT_GAME_VERSION;
  if (built) {
    built.textContent = NIGHT_BUILT_AT;
    built.setAttribute('datetime', NIGHT_BUILT_AT.replace(' ', 'T') + '+08:00');
  }
})();
const GODOT_CONFIG = {
  args: [],
  canvasResizePolicy: 2,
  emscriptenPoolSize: 8,
  ensureCrossOriginIsolationHeaders: false,
  executable: 'night',
  mainPack: NIGHT_PCK,
  experimentalVK: false,
  fileSizes: {
    'night.pck': 147298020,
    'night.wasm': 39514754
  },
  focusCanvas: true,
  gdextensionLibs: []
};
if (NIGHT_PCK !== 'night.pck') {
  GODOT_CONFIG.fileSizes[NIGHT_PCK] = 147298020;
}
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=' + GODOT_CONFIG.fileSizes[NIGHT_PCK] + '.r3', { updateViaCache: 'none' });
}

(function () {
  const statusOverlay = document.getElementById('status');
  const statusProgress = document.getElementById('status-progress');
  const statusNotice = document.getElementById('status-notice');
  const enterBtn = document.getElementById('enterBtn');
  const gate = document.getElementById('gate');
  const backFab = document.getElementById('backFab');
  const gateLoad = document.getElementById('gateLoad');
  const gateBar = document.getElementById('gateBar');
  const gateLoadText = document.getElementById('gateLoadText');

  const gateNote = document.getElementById('gateNote');

  let initializing = true;
  let statusMode = '';
  let packCached = false;

  async function localPack() {
    if (!('caches' in window)) return null;
    try {
      return await caches.match(NIGHT_PCK, { ignoreSearch: true });
    } catch (err) {
      return null;
    }
  }

  async function markCachedPack() {
    packCached = !!(await localPack());
    if (packCached && gateNote) {
      gateNote.textContent = '游戏文件已缓存在本机，再次启程无需下载';
    }
  }

  async function waitForWorker(ms) {
    if (!('serviceWorker' in navigator)) return;
    const ctrl = navigator.serviceWorker.controller;
    if (!ctrl || (ctrl.scriptURL || '').indexOf('.r3') !== -1) return;
    try {
      await Promise.race([
        new Promise(function (resolve) {
          navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        }),
        new Promise(function (resolve) { setTimeout(resolve, ms); }),
      ]);
    } catch (err) {}
  }

  function yieldPaint() {
    return new Promise(function (resolve) { requestAnimationFrame(resolve); });
  }

  async function readBody(res, onBytes, expected) {
    const hinted = Number(res.headers.get('Content-Length')) || expected || 0;
    if (!res.body || !res.body.getReader) {
      const buf = await res.arrayBuffer();
      onBytes(buf.byteLength);
      return buf;
    }
    const reader = res.body.getReader();
    const chunks = [];
    let loaded = 0;
    let sincePaint = 0;
    for (;;) {
      const step = await reader.read();
      if (step.done) break;
      chunks.push(step.value);
      loaded += step.value.byteLength;
      sincePaint += step.value.byteLength;
      onBytes(loaded);
      if (sincePaint >= 2 * 1024 * 1024) {
        sincePaint = 0;
        await yieldPaint();
      }
    }
    onBytes(Math.max(loaded, hinted));
    const bytes = new Uint8Array(loaded);
    let offset = 0;
    sincePaint = 0;
    for (let i = 0; i < chunks.length; i++) {
      bytes.set(chunks[i], offset);
      offset += chunks[i].byteLength;
      sincePaint += chunks[i].byteLength;
      if (sincePaint >= 8 * 1024 * 1024) {
        sincePaint = 0;
        await yieldPaint();
      }
    }
    onBytes(loaded);
    return bytes.buffer;
  }

  async function loadPack(onBytes) {
    const expected = GODOT_CONFIG.fileSizes[NIGHT_PCK];
    const cached = await localPack();
    if (cached) {
      return readBody(cached, onBytes, expected);
    }
    const res = await fetch(NIGHT_PCK, { mode: 'cors' });
    if (!res.ok) throw new Error('游戏包 night.pck 未能加载（HTTP ' + res.status + '）');
    const buf = await readBody(res, onBytes, expected);
    await storePack(buf);
    return buf;
  }

  async function storePack(buf) {
    if (!('caches' in window)) return;
    try {
      const cache = await caches.open('night-pck-' + GODOT_CONFIG.fileSizes[NIGHT_PCK]);
      await cache.put(NIGHT_PCK, new Response(buf, {
        headers: {
          'Content-Type': 'application/octet-stream',
          'Content-Length': String(buf.byteLength),
        },
      }));
    } catch (err) {}
  }

  markCachedPack();

  function formatMB(bytes) {
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  let bootTimer = null;
  const bootHints = [
    '行囊已就绪，正在点亮灯笼…',
    '正在铺开旧渡口…',
    '夜色渐起，请稍候…',
  ];

  function stopBootHints() {
    if (bootTimer) {
      clearInterval(bootTimer);
      bootTimer = null;
    }
    gateLoad.classList.remove('is-booting');
  }

  function showBooting() {
    gateLoad.classList.remove('is-indeterminate');
    gateLoad.classList.add('is-on', 'is-booting');
    gateBar.style.width = '100%';
    let i = 0;
    gateLoadText.textContent = bootHints[0];
    if (bootTimer) clearInterval(bootTimer);
    bootTimer = setInterval(function () {
      i = (i + 1) % bootHints.length;
      gateLoadText.textContent = bootHints[i];
    }, 1400);
  }

  function showGateProgress() {
    stopBootHints();
    enterBtn.classList.add('is-hidden');
    gateLoad.classList.remove('is-error');
    gateLoad.classList.add('is-on', 'is-indeterminate');
    gateBar.style.width = '';
    if (packCached) {
      gateLoadText.textContent = '正在从本机读取行囊…';
    } else {
      gateLoadText.textContent = '正在装载行囊…';
    }
  }

  function updateGateProgress(current, total) {
    if (gateLoad.classList.contains('is-booting')) return;
    if (!(current > 0 && total > 0)) {
      gateLoad.classList.add('is-indeterminate');
      return;
    }
    const pct = Math.min(100, Math.round((current / total) * 100));
    gateLoad.classList.remove('is-indeterminate');
    gateBar.style.width = pct + '%';
    const label = packCached ? '本机读取 ' : '装载中 ';
    gateLoadText.textContent = label + pct + '% · ' + formatMB(current) + ' / ' + formatMB(total);
  }

  function setStatusMode(mode) {
    if (statusMode === mode || !initializing) return;
    if (mode === 'hidden') {
      statusOverlay.remove();
      initializing = false;
      return;
    }
    statusOverlay.style.visibility = 'visible';
    statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
    statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
    statusMode = mode;
  }

  function setStatusNotice(text) {
    while (statusNotice.lastChild) {
      statusNotice.removeChild(statusNotice.lastChild);
    }
    const lines = text.split('\n');
    lines.forEach((line) => {
      statusNotice.appendChild(document.createTextNode(line));
      statusNotice.appendChild(document.createElement('br'));
    });
  }

  function displayFailureNotice(err) {
    console.error(err);
    let message = 'An unknown error occurred.';
    if (err instanceof Error) message = err.message;
    else if (typeof err === 'string') message = err;
    if (/404|failed to fetch|load/i.test(message)) {
      message = '行囊暂未送达，请检查网络后重试。已下载的缓存会尽量保留。';
    }
    stopBootHints();
    gate.classList.remove('is-gone');
    gateLoad.classList.add('is-on', 'is-error');
    gateLoad.classList.remove('is-indeterminate', 'is-booting');
    gateBar.style.width = '0';
    gateLoadText.textContent = message;
    enterBtn.classList.remove('is-hidden');
    enterBtn.disabled = false;
    enterBtn.textContent = '重试';
    setStatusNotice(message);
    setStatusMode('notice');
    initializing = false;
  }

  async function pckExists() {
    if (await localPack()) return true;
    try {
      const res = await fetch(NIGHT_PCK, { method: 'HEAD' });
      return res.ok;
    } catch (err) {
      return false;
    }
  }

  async function startGodot() {
    const missing = Engine.getMissingFeatures({
      threads: GODOT_THREADS_ENABLED,
    });

    if (missing.length !== 0) {
      const missingMsg = 'Error\n当前浏览器缺少运行 Godot 网页版所需的能力：\n';
      displayFailureNotice(missingMsg + missing.join('\n'));
      return;
    }

    setStatusMode('progress');
    const pckSize = GODOT_CONFIG.fileSizes[NIGHT_PCK];
    const wasmSize = GODOT_CONFIG.fileSizes['night.wasm'];
    let pckLoaded = 0;
    let wasmLoaded = 0;

    function report() {
      const current = pckLoaded + wasmLoaded;
      const total = pckSize + wasmSize;
      updateGateProgress(current, total);
      if (current > 0 && total > 0) {
        statusProgress.value = current;
        statusProgress.max = total;
      }
    }

    try {
      engine.config.update({
        onProgress: function (current) {
          wasmLoaded = current || 0;
          report();
        },
      });
      engine.config.args = ['--main-pack', NIGHT_PCK];
      const packPromise = loadPack(function (loaded) {
        pckLoaded = loaded;
        report();
      });
      const buf = (await Promise.all([packPromise, engine.init('night')]))[0];
      showBooting();
      if (window.NightGateAtmosphere) window.NightGateAtmosphere.stop();
      await yieldPaint();
      await engine.preloadFile(buf, NIGHT_PCK);
      await engine.start();
      stopBootHints();
      setStatusMode('hidden');
      gate.classList.add('is-gone');
      markCachedPack();
    } catch (err) {
      displayFailureNotice(err);
    }
  }

  enterBtn.addEventListener('click', async function () {
    initializing = true;
    statusMode = '';
    enterBtn.disabled = true;
    backFab.classList.add('is-on');
    showGateProgress();
    if (window.NightGateAtmosphere) window.NightGateAtmosphere.stop();
    await waitForWorker(4000);
    await markCachedPack();
    const ready = await pckExists();
    if (!ready) {
      displayFailureNotice('行囊暂未送达，请检查网络后重试。');
      return;
    }
    startGodot();
  });
}());
  </script>
</body>
