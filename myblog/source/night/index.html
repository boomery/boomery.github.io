<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
  <title>槐安夜雨 · 夜行镖</title>
  <meta name="description" content="boomery 的暗黑武侠 Web 游戏：夜行镖 · 槐安夜雨。开场直入旧渡口。">
  <link rel="icon" type="image/png" href="night.icon.png">
  <link rel="apple-touch-icon" href="night.apple-touch-icon.png">
  <style>
html, body, #canvas {
  margin: 0;
  padding: 0;
  border: 0;
}

body {
  color: #efe6d6;
  background: #0b0a09;
  overflow: hidden;
  touch-action: none;
  font-family: "Songti SC", "Noto Serif SC", "Songti SC", "STSong", serif;
}

#canvas {
  display: block;
}

#canvas:focus { outline: none; }

#status, #status-splash, #status-progress {
  position: absolute;
  left: 0;
  right: 0;
}

#status, #status-splash {
  top: 0;
  bottom: 0;
}

#status {
  background-color: #141210;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  visibility: hidden;
  z-index: 4;
}

#status-splash {
  max-height: 100%;
  max-width: 100%;
  margin: auto;
}

#status-splash.show-image--false { display: none; }
#status-splash.fullsize--true {
  height: 100%;
  width: 100%;
  object-fit: contain;
}
#status-splash.use-filter--false { image-rendering: pixelated; }

#status-progress, #status-notice { display: none; }

#status-progress {
  bottom: 10%;
  width: 50%;
  margin: 0 auto;
}

#status-notice {
  background-color: #5b3943;
  border-radius: 0.5rem;
  border: 1px solid #9b3943;
  color: #e0e0e0;
  font-family: "PingFang SC", "Noto Sans", Arial, sans-serif;
  line-height: 1.3;
  margin: 0 2rem;
  overflow: hidden;
  padding: 1rem;
  text-align: center;
  z-index: 5;
}

.gate {
  position: fixed;
  inset: 0;
  z-index: 8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 72px 24px 88px;
  background:
    radial-gradient(ellipse 70% 55% at 50% 0%, rgba(120, 40, 28, 0.35), transparent 58%),
    radial-gradient(ellipse 50% 40% at 80% 90%, rgba(40, 32, 72, 0.4), transparent 60%),
    #0b0a09;
  transition: opacity 0.45s ease, visibility 0.45s ease;
}

.gate.is-gone {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.gate::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(239, 230, 214, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(239, 230, 214, 0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
  pointer-events: none;
}

.gate-nav {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 22px;
  font-family: "PingFang SC", "Inter", system-ui, sans-serif;
}

.gate-nav a {
  color: rgba(239, 230, 214, 0.72);
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 0.06em;
}

.gate-nav a:hover { color: #f3c98a; }

.gate-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}

.gate-brand img { width: 28px; height: 28px; }

.gate-card {
  position: relative;
  width: min(420px, 100%);
  text-align: center;
}

.gate-logo {
  display: block;
  margin: 0 auto;
  width: 168px;
  height: 168px;
  object-fit: contain;
  border-radius: 50%;
  border: 1px solid rgba(243, 201, 138, 0.28);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  background: #0b1214;
}

.gate-engine {
  position: absolute;
  right: 16px;
  bottom: 14px;
  z-index: 1;
  width: 96px;
  text-decoration: none;
  opacity: 0.7;
}

.gate-engine:hover { opacity: 1; }

.gate-engine img {
  width: 96px;
  height: auto;
  display: block;
}

@media (max-width: 480px) {
  .gate-logo { width: 132px; height: 132px; }
  .gate-engine { width: 72px; right: 12px; bottom: 10px; }
  .gate-engine img { width: 72px; }
}

.gate-kicker {
  margin: 22px 0 8px;
  font-family: "PingFang SC", system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.28em;
  color: #f3c98a;
}

.gate-card h1 {
  margin: 0;
  font-size: clamp(32px, 8vw, 48px);
  font-weight: 500;
  letter-spacing: 0.18em;
}

.gate-card p {
  margin: 14px 0 0;
  color: rgba(239, 230, 214, 0.68);
  font-size: 15px;
  line-height: 1.7;
  letter-spacing: 0.04em;
}

.gate-note {
  margin-top: 10px;
  font-family: "PingFang SC", system-ui, sans-serif;
  font-size: 12px;
  color: rgba(239, 230, 214, 0.42);
}

.gate-btn {
  margin-top: 28px;
  appearance: none;
  border: 1px solid rgba(243, 201, 138, 0.55);
  background: linear-gradient(180deg, #8a2a22, #5c1612);
  color: #f7ecd8;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: 0.28em;
  padding: 12px 36px;
  border-radius: 4px;
  cursor: pointer;
}

.gate-btn:hover { filter: brightness(1.08); }
.gate-btn:disabled {
  cursor: wait;
  opacity: 0.7;
}

.gate-btn.is-hidden { display: none; }

.gate-load {
  display: none;
  margin-top: 28px;
  width: 100%;
}

.gate-load.is-on { display: block; }

.gate-load__track {
  height: 3px;
  background: rgba(243, 201, 138, 0.16);
  border-radius: 99px;
  overflow: hidden;
}

.gate-load__bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #8a2a22, #f3c98a);
  border-radius: 99px;
  transition: width 0.2s ease-out;
}

.gate-load.is-indeterminate .gate-load__bar {
  width: 32%;
  animation: gate-load-slide 1.1s ease-in-out infinite;
}

@keyframes gate-load-slide {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(380%); }
}

.gate-load__text {
  margin: 12px 0 0;
  font-family: "PingFang SC", system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: rgba(239, 230, 214, 0.55);
}

.back-fab {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 6;
  display: none;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(12, 10, 9, 0.72);
  border: 1px solid rgba(243, 201, 138, 0.28);
  color: #efe6d6;
  text-decoration: none;
  font-family: "PingFang SC", system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.06em;
}

.back-fab.is-on { display: inline-flex; }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <nav class="gate-nav">
      <a class="gate-brand" href="/">
        <img src="/images/boomery-logo.svg" width="28" height="28" alt="">
        boomery
      </a>
      <a href="/space/">← 数字空间</a>
    </nav>
    <div class="gate-card">
      <img class="gate-logo" src="night.icon.png" alt="槐安夜雨">
      <div class="gate-kicker">WEB GAME</div>
      <h1>槐安夜雨</h1>
      <p>七年之前，雨夜走镖，同门惨死。追凶之路漫漫，前路飘摇。</p>
      <p class="gate-note" id="gateNote">需下载游戏文件170MB，首次之后会留在本机</p>
      <button class="gate-btn" id="enterBtn" type="button">即刻启程</button>
      <div class="gate-load" id="gateLoad">
        <div class="gate-load__track">
          <div class="gate-load__bar" id="gateBar"></div>
        </div>
        <p class="gate-load__text" id="gateLoadText">正在装载行囊…</p>
      </div>
    </div>
    <a class="gate-engine" href="https://godotengine.org" target="_blank" rel="noopener" title="Made with Godot">
      <img src="night.png" alt="Godot">
    </a>
  </div>

  <a class="back-fab" id="backFab" href="/night/">← 返回</a>

  <canvas id="canvas">
    Your browser does not support the canvas tag.
  </canvas>

  <noscript>需要启用 JavaScript 才能运行这款游戏。</noscript>

  <div id="status">
    <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="night.icon.png" alt="">
    <progress id="status-progress"></progress>
    <div id="status-notice"></div>
  </div>

  <script src="night.js"></script>
  <script>
window.NightSave = {
  API: 'https://gallery-api.boomery.top/api/night-saves',
  timer: null,
  latest: null,
  parsePayload: function (payload) {
    if (typeof payload === 'string') {
      try { payload = JSON.parse(payload); } catch (err) { return {}; }
    }
    return payload && typeof payload === 'object' ? payload : {};
  },
  invoke: function (cb, result) {
    var json = typeof result === 'string' ? result : JSON.stringify(result);
    var targets = [];
    if (cb) targets.push(cb);
    if (window._nightSaveCb && window._nightSaveCb !== cb) targets.push(window._nightSaveCb);
    for (var i = 0; i < targets.length; i++) {
      try { targets[i](json); } catch (err) {}
    }
  },
  queuePut: function (token, payload) {
    var pack = { token: token, payload: this.parsePayload(payload) };
    this.latest = pack;
    clearTimeout(this.timer);
    var self = this;
    this.timer = setTimeout(function () { self.put(pack.token, pack.payload); }, 2200);
  },
  put: function (token, payload, cb) {
    var body = this.parsePayload(payload);
    var self = this;
    return fetch(this.API, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        active_slot: body.active_slot,
        slots: body.slots
      })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        var result = { ok: r.ok && data.ok !== false, error: data.error || '', status: r.status };
        if (result.ok && self.latest && self.latest.token === token) self.latest = null;
        self.invoke(cb, result);
        return result;
      });
    }).catch(function (err) {
      var result = { ok: false, error: String(err) };
      self.invoke(cb, result);
      return result;
    });
  },
  get: function (token, cb) {
    var self = this;
    return fetch(this.API + '?token=' + encodeURIComponent(token)).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        var result = Object.assign({ ok: r.ok && data.ok !== false, error: data.error || '', status: r.status }, data);
        self.invoke(cb, result);
        return result;
      });
    }).catch(function (err) {
      var result = { ok: false, error: String(err) };
      self.invoke(cb, result);
      return result;
    });
  },
  copy: function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    }
  },
  flush: function () {
    if (!this.latest) return;
    var pack = this.latest;
    this.put(pack.token, pack.payload);
  }
};
window.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') window.NightSave.flush();
});
window.addEventListener('pagehide', function () {
  window.NightSave.flush();
});

const NIGHT_PCK = 'https://cdn.boomery.top/night.pck';
const GODOT_CONFIG = {
  args: [],
  canvasResizePolicy: 2,
  emscriptenPoolSize: 8,
  ensureCrossOriginIsolationHeaders: false,
  executable: 'night',
  mainPack: NIGHT_PCK,
  experimentalVK: false,
  fileSizes: {
    'night.pck': 147298020,
    'night.wasm': 39514754
  },
  focusCanvas: true,
  gdextensionLibs: []
};
if (NIGHT_PCK !== 'night.pck') {
  GODOT_CONFIG.fileSizes[NIGHT_PCK] = 147298020;
}
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=' + GODOT_CONFIG.fileSizes[NIGHT_PCK], { updateViaCache: 'none' });
}

(function () {
  const statusOverlay = document.getElementById('status');
  const statusProgress = document.getElementById('status-progress');
  const statusNotice = document.getElementById('status-notice');
  const enterBtn = document.getElementById('enterBtn');
  const gate = document.getElementById('gate');
  const backFab = document.getElementById('backFab');
  const gateLoad = document.getElementById('gateLoad');
  const gateBar = document.getElementById('gateBar');
  const gateLoadText = document.getElementById('gateLoadText');

  const gateNote = document.getElementById('gateNote');

  let initializing = true;
  let statusMode = '';
  let packCached = false;

  async function localPack() {
    if (!('caches' in window)) return null;
    try {
      return await caches.match(NIGHT_PCK, { ignoreSearch: true });
    } catch (err) {
      return null;
    }
  }

  async function markCachedPack() {
    packCached = !!(await localPack());
    if (packCached && gateNote) {
      gateNote.textContent = '游戏文件已缓存在本机，再次启程无需下载';
    }
  }

  async function waitForWorker(ms) {
    if (!('serviceWorker' in navigator)) return;
    try {
      await Promise.race([
        navigator.serviceWorker.ready,
        new Promise(function (resolve) { setTimeout(resolve, ms); }),
      ]);
    } catch (err) {}
  }

  markCachedPack();

  function formatMB(bytes) {
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function showGateProgress() {
    enterBtn.classList.add('is-hidden');
    gateLoad.classList.add('is-on', 'is-indeterminate');
    gateBar.style.width = '';
    if (packCached) {
      gateLoadText.textContent = '正在从本机装载…';
    } else {
      gateLoadText.textContent = '正在装载行囊…';
    }
  }

  function updateGateProgress(current, total) {
    if (!(current > 0 && total > 0)) {
      gateLoad.classList.add('is-indeterminate');
      gateLoadText.textContent = '正在接通夜路…';
      return;
    }
    const pct = Math.min(100, Math.round((current / total) * 100));
    gateLoad.classList.remove('is-indeterminate');
    gateBar.style.width = pct + '%';
    gateLoadText.textContent = '装载中 ' + pct + '% · ' + formatMB(current) + ' / ' + formatMB(total);
  }

  function setStatusMode(mode) {
    if (statusMode === mode || !initializing) return;
    if (mode === 'hidden') {
      statusOverlay.remove();
      initializing = false;
      return;
    }
    statusOverlay.style.visibility = 'visible';
    statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
    statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
    statusMode = mode;
  }

  function setStatusNotice(text) {
    while (statusNotice.lastChild) {
      statusNotice.removeChild(statusNotice.lastChild);
    }
    const lines = text.split('\n');
    lines.forEach((line) => {
      statusNotice.appendChild(document.createTextNode(line));
      statusNotice.appendChild(document.createElement('br'));
    });
  }

  function displayFailureNotice(err) {
    console.error(err);
    let message = 'An unknown error occurred.';
    if (err instanceof Error) message = err.message;
    else if (typeof err === 'string') message = err;
    if (/404|failed to fetch|load/i.test(message)) {
      message += '\n游戏包 night.pck（约 140MB）未能加载。GitHub/Vercel 无法托管超过 100MB 的单文件，需将 pck 放到 Cloudflare R2 等 CDN，并修改本页顶部的 NIGHT_PCK。';
    }
    gate.classList.remove('is-gone');
    gateLoad.classList.add('is-on');
    gateLoad.classList.remove('is-indeterminate');
    gateBar.style.width = '0';
    gateLoadText.textContent = message;
    enterBtn.classList.remove('is-hidden');
    enterBtn.disabled = false;
    enterBtn.textContent = '重试';
    setStatusNotice(message);
    setStatusMode('notice');
    initializing = false;
  }

  async function pckExists() {
    if (await localPack()) return true;
    try {
      const res = await fetch(NIGHT_PCK, { method: 'HEAD' });
      return res.ok;
    } catch (err) {
      return false;
    }
  }

  function startGodot() {
    const missing = Engine.getMissingFeatures({
      threads: GODOT_THREADS_ENABLED,
    });

    if (missing.length !== 0) {
      const missingMsg = 'Error\n当前浏览器缺少运行 Godot 网页版所需的能力：\n';
      displayFailureNotice(missingMsg + missing.join('\n'));
      return;
    }

    setStatusMode('progress');
    engine.startGame({
      onProgress: function (current, total) {
        updateGateProgress(current, total);
        if (current > 0 && total > 0) {
          statusProgress.value = current;
          statusProgress.max = total;
        } else {
          statusProgress.removeAttribute('value');
          statusProgress.removeAttribute('max');
        }
      },
    }).then(() => {
      setStatusMode('hidden');
      gate.classList.add('is-gone');
      markCachedPack();
    }, displayFailureNotice);
  }

  enterBtn.addEventListener('click', async function () {
    enterBtn.disabled = true;
    backFab.classList.add('is-on');
    await waitForWorker(1800);
    await markCachedPack();
    showGateProgress();
    const ready = await pckExists();
    if (!ready) {
      displayFailureNotice('游戏包 night.pck（约 140MB）未找到。GitHub/Vercel 无法托管超过 100MB 的单文件，请把 pck 放到 Cloudflare R2 等 CDN，并修改本页顶部的 NIGHT_PCK。');
      return;
    }
    startGodot();
  });
}());
  </script>
</body>
</html>
