<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>boomery Gallery</title>
  <link rel="icon" href="/images/boomery-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { touch-action: manipulation; }

    :root {
      --bg: #f5f7f9;
      --accent: #4a5fd4;
      --accent-2: #8b5cf6;
      --text: #1a1a2e;
      --text-secondary: #555;
      --muted: #888;
      --glass: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.65);
      --shadow: rgba(100, 120, 180, 0.14);
      --radius: 12px;
    }

    @keyframes fluid-drift-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(6%, -4%) scale(1.08); }
      50% { transform: translate(-4%, 5%) scale(0.96); }
      75% { transform: translate(3%, 3%) scale(1.04); }
    }
    @keyframes fluid-drift-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-5%, 4%) scale(1.06); }
      66% { transform: translate(4%, -3%) scale(0.98); }
    }
    @keyframes grid-drift {
      0% { background-position: 0 0; }
      100% { background-position: 48px 48px; }
    }
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 95, 212, 0.45); }
      50% { box-shadow: 0 0 0 7px rgba(74, 95, 212, 0); }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'PingFang SC', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      filter: blur(90px);
    }
    body::before {
      background:
        radial-gradient(ellipse 55% 45% at 25% 35%, rgba(180, 200, 255, 0.55) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 75% 65%, rgba(220, 190, 255, 0.45) 0%, transparent 70%),
        radial-gradient(ellipse 45% 50% at 50% 90%, rgba(255, 210, 190, 0.35) 0%, transparent 70%);
      animation: fluid-drift-a 22s ease-in-out infinite;
      opacity: 0.85;
    }
    body::after {
      background:
        radial-gradient(ellipse 50% 45% at 80% 25%, rgba(190, 230, 255, 0.4) 0%, transparent 70%),
        radial-gradient(ellipse 55% 40% at 15% 75%, rgba(200, 180, 255, 0.35) 0%, transparent 70%);
      animation: fluid-drift-b 28s ease-in-out infinite;
      opacity: 0.7;
    }

    /* ── 首屏飘落区 ── */
    .gallery-screen {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .gallery-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    #galleryParticles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.85;
    }
    .gallery-bg__grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(74, 95, 212, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 95, 212, 0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: grid-drift 24s linear infinite;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, black 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, black 20%, transparent 75%);
    }
    .gallery-bg__glow {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 70% 60% at 30% 20%, rgba(74, 95, 212, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(140, 100, 255, 0.14) 0%, transparent 70%);
    }

    /* ── Header ── */
    .page-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 16px 40px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 16px rgba(100, 120, 180, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .gallery-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .site-logo {
      display: inline-flex;
      flex-shrink: 0;
      width: 36px;
      height: 36px;
    }
    .site-logo svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1;
    }
    .logo span {
      background: linear-gradient(90deg, #4a5fd4, #8b5cf6, #4a9fd4, #4a5fd4);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .back-link:hover {
      background: rgba(74, 95, 212, 0.08);
      color: var(--accent);
    }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* ── 模式切换 ── */
    .mode-switcher {
      display: flex;
      gap: 4px;
      background: rgba(74, 95, 212, 0.06);
      border: 1px solid rgba(74, 95, 212, 0.12);
      border-radius: 999px;
      padding: 3px;
    }
    .mode-btn {
      background: transparent;
      border: none;
      border-radius: 999px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 6px 14px;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .mode-btn:hover { color: var(--accent); }
    .mode-btn.active {
      background: linear-gradient(135deg, #4a5fd4, #5a4fd4);
      color: #fff;
      box-shadow: 0 4px 16px rgba(74, 95, 212, 0.28);
    }

    /* ── 视图容器 ── */
    .gallery-viewport {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ── 雪花飘落场景 ── */
    .drift-scene {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .flake {
      position: absolute;
      pointer-events: all;
      cursor: pointer;
      will-change: transform;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 24px rgba(100, 120, 180, 0.18);
      transition: box-shadow 0.3s, transform 0.3s;
    }
    .flake:hover {
      box-shadow: 0 0 0 2px var(--accent), 0 8px 32px rgba(74, 95, 212, 0.28);
      transform: scale(1.04);
      z-index: 50 !important;
    }
    .flake img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* ── 底部渐变遮罩 ── */
    .fade-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to top, var(--bg) 30%, transparent);
      z-index: 10;
      pointer-events: none;
    }

    /* ── 数量统计 ── */
    .counter {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .counter span { color: var(--accent); font-weight: 700; }

    /* ── 向下滚动提示 ── */
    .scroll-hint {
      position: absolute;
      bottom: 14px;
      right: 40px;
      z-index: 20;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      animation: hintBob 2s ease-in-out infinite;
    }
    @keyframes hintBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(4px); }
    }

    /* ── 柱廊：多柱 3D 自转 ── */
    .colonnade-view {
      position: absolute;
      inset: 0;
      overflow: hidden;
      padding: 82px 10px 92px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      perspective: 1100px;
    }
    .colonnade-view.is-dragging { cursor: grabbing; }

    .colonnade-arena {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(12px, 3vw, 28px);
      height: 100%;
      max-width: 960px;
      margin: 0 auto;
      transform-style: preserve-3d;
    }

    .colonnade-column {
      flex: 1;
      max-width: 180px;
      min-width: 0;
      height: min(72vh, 520px);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 中心棍身 */
    .colonnade-rod {
      position: absolute;
      left: 50%;
      top: 4%;
      bottom: 4%;
      width: 10px;
      margin-left: -5px;
      border-radius: 5px;
      background: linear-gradient(
        90deg,
        rgba(74,95,212,0.12) 0%,
        rgba(74,95,212,0.45) 45%,
        rgba(255,255,255,0.5) 50%,
        rgba(74,95,212,0.45) 55%,
        rgba(74,95,212,0.12) 100%
      );
      box-shadow:
        inset 0 0 6px rgba(74, 95, 212, 0.15),
        0 0 18px rgba(74, 95, 212, 0.12);
      pointer-events: none;
      z-index: 0;
    }
    .colonnade-rod-cap {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(74,95,212,0.45), transparent);
      pointer-events: none;
      z-index: 1;
    }
    .colonnade-rod-cap--top { top: 2%; opacity: 0.6; }
    .colonnade-rod-cap--bot { bottom: 2%; opacity: 0.35; }

    .colonnade-cylinder {
      position: relative;
      width: 100%;
      height: 88%;
      transform-style: preserve-3d;
      will-change: transform;
      z-index: 2;
    }

    .colonnade-face {
      position: absolute;
      left: 50%;
      top: 50%;
      padding: 0;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 20px var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: box-shadow 0.22s;
    }
    .colonnade-face:hover {
      box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(74, 95, 212, 0.22);
    }
    .colonnade-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .colonnade-hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── 胶片横向滚动 ── */
    .filmstrip-view {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 72px 0 88px;
    }
    .filmstrip-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      padding: 0 max(24px, calc(50vw - 130px));
      scrollbar-width: thin;
      scrollbar-color: rgba(74, 95, 212, 0.25) transparent;
    }
    .filmstrip-track::-webkit-scrollbar { height: 4px; }
    .filmstrip-track::-webkit-scrollbar-thumb {
      background: rgba(74, 95, 212, 0.25);
      border-radius: 4px;
    }
    .filmstrip-item {
      flex: 0 0 auto;
      width: min(260px, 74vw);
      scroll-snap-align: center;
      cursor: pointer;
      border-radius: 16px;
      overflow: hidden;
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid var(--glass-border);
      box-shadow: 0 6px 28px var(--shadow);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .filmstrip-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 0 1px var(--accent), 0 12px 36px rgba(74, 95, 212, 0.18);
    }
    .filmstrip-item img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }
    .filmstrip-meta {
      padding: 12px 14px 14px;
      border-top: 1px solid rgba(74, 95, 212, 0.08);
    }
    .filmstrip-meta strong {
      display: block;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .filmstrip-meta span {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    /* ── 网格平铺 ── */
    .grid-view {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 88px 24px 100px;
      scrollbar-width: thin;
      scrollbar-color: rgba(74, 95, 212, 0.25) transparent;
    }
    .grid-view::-webkit-scrollbar { width: 4px; }
    .grid-view::-webkit-scrollbar-thumb {
      background: rgba(74, 95, 212, 0.25);
      border-radius: 4px;
    }
    .grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .grid-item {
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 20px var(--shadow);
      transition: transform 0.22s, box-shadow 0.22s;
    }
    .grid-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 0 1px var(--accent), 0 10px 28px rgba(74, 95, 212, 0.16);
    }
    .grid-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }
    .grid-item-meta {
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(74, 95, 212, 0.08);
    }
    .grid-item-meta strong {
      display: block;
      color: var(--text);
      font-size: 0.78rem;
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .grid-item-meta span {
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
    }

    .gallery-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }

    /* ── 评论区 ── */
    .comment-section {
      position: relative;
      z-index: 50;
      background: transparent;
      padding: 60px 40px 80px;
      max-width: 860px;
      margin: 0 auto;
    }

    .comment-section h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 28px;
      padding-bottom: 0;
      border-bottom: none;
    }
    .comment-section h2::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2.2s ease infinite;
      flex-shrink: 0;
    }
    .comment-section h2 span { color: var(--accent); }

    .comment-card {
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 4px 24px var(--shadow);
      padding: 28px 32px;
    }

    /* ── 灯箱 ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(16px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 90vw;
      max-height: 90vh;
      animation: lbIn 0.35s cubic-bezier(.22,.68,0,1.2);
      will-change: transform;
    }

    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.85) rotate(-3deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .lightbox-inner img {
      max-width: 88vw;
      max-height: 78vh;
      border-radius: var(--radius);
      display: block;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 14px;
      text-align: center;
      font-size: 0.82rem;
      color: #aaa;
      letter-spacing: 0.06em;
    }
    .lightbox-caption strong { color: #f0f0f0; margin-right: 8px; }

    .lightbox-close {
      position: absolute;
      top: -16px; right: -16px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(74, 95, 212, 0.2);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      box-shadow: 0 4px 16px rgba(100, 120, 180, 0.2);
    }
    .lightbox-close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .lightbox-controls {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }

    .lightbox-counter {
      font-size: 0.78rem;
      color: #aaa;
      letter-spacing: 0.08em;
      min-width: 48px;
      text-align: center;
      white-space: nowrap;
    }
    .lightbox-counter span { color: #f0f0f0; }

    .lightbox-nav {
      width: 42px; height: 42px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(74, 95, 212, 0.2);
      border-radius: 50%;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(100, 120, 180, 0.2);
    }
    .lightbox-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── 上传按钮（悬浮右下角） ── */
    .upload-fab {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 500;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a5fd4, #5a4fd4);
      color: #fff;
      border: 1px solid rgba(74, 95, 212, 0.5);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(74, 95, 212, 0.32);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .upload-fab:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(74, 95, 212, 0.42);
    }

    /* ── 上传模态框 ── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
    }
    .modal.open { display: flex; }

    .modal-box {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 32px;
      width: min(420px, 92vw);
      box-shadow: 0 8px 40px rgba(74, 95, 212, 0.14), 0 2px 8px rgba(0, 0, 0, 0.04);
      animation: lbIn 0.28s cubic-bezier(.22,.68,0,1.2);
    }

    .modal-box h3 {
      font-size: 0.85rem;
      font-weight: 700;

<script>
/* ═══════════════════════════════════════
   配置：部署后将 API_BASE 替换为实际地址
   ═══════════════════════════════════════ */
const API_BASE = 'https://gallery-api.boomery.top';

/* ══════════════════════════════
   背景粒子（与首页 Hero 一致）
══════════════════════════════ */
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.getElementById('galleryParticles');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let dots = [];
  let w = 0, h = 0;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = Math.floor(rect.width);
    h = canvas.height = Math.floor(rect.height);
  }

  function init() {
    resize();
    const count = Math.min(56, Math.floor(w * h / 8000)) || 28;
    dots = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.4 + 0.4,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      a: Math.random() * 0.45 + 0.15,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x;
        const dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 110) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(74,95,212,${0.12 * (1 - dist / 110)})`;
          ctx.lineWidth = 0.6;
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.stroke();
        }
      }
    }
    dots.forEach(d => {
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0 || d.x > w) d.vx *= -1;
      if (d.y < 0 || d.y > h) d.vy *= -1;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(74,95,212,${d.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  init();
  draw();
  window.addEventListener('resize', init);
})();

/* ══════════════════════════════
   视图模式：飘落 / 柱廊 / 胶片
══════════════════════════════ */
const viewport = document.getElementById('galleryViewport');
const MODE_KEY = 'gallery-view-mode';
let PHOTOS = [];
let currentMode = localStorage.getItem(MODE_KEY) || 'drift';
let modeState = { cleanup: null };

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const rand = (a, b) => a + Math.random() * (b - a);

function updateCounter() {
  document.getElementById('counter').innerHTML = `<span>${PHOTOS.length}</span> photos`;
}

function setModeButtons(mode) {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
}

function stopMode() {
  if (modeState.cleanup) {
    modeState.cleanup();
    modeState.cleanup = null;
  }
  viewport.innerHTML = '';
}

function renderEmpty() {
  viewport.innerHTML = '<div class="gallery-empty">暂无图片</div>';
}

function renderGallery() {
  stopMode();
  updateCounter();
  if (!PHOTOS.length) {
    renderEmpty();
    return;
  }
  if (currentMode === 'colonnade') renderColonnade();
  else if (currentMode === 'filmstrip') renderFilmstrip();
  else if (currentMode === 'grid') renderGrid();
  else renderDrift();
}

function setMode(mode) {
  if (!['drift', 'colonnade', 'filmstrip', 'grid'].includes(mode)) return;
  currentMode = mode;
  localStorage.setItem(MODE_KEY, mode);
  setModeButtons(mode);
  renderGallery();
}

document.getElementById('modeSwitcher').addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if (btn) setMode(btn.dataset.mode);
});

/* ── 飘落模式 ── */
function renderDrift() {
  const scene = document.createElement('div');
  scene.className = 'drift-scene';
  viewport.appendChild(scene);

  const flakes = [];
  let rafId = null;

  function createFlake(item, idx, initY) {
    const size = rand(90, 190);
    const el = document.createElement('div');
    el.className = 'flake';
    el.style.cssText = `width:${size}px;height:${size}px;z-index:${Math.floor(rand(2, 20))}`;

    const img = document.createElement('img');
    img.src = item.src;
    img.alt = item.title;
    img.draggable = false;
    el.appendChild(img);
    el.addEventListener('click', () => openLightbox(idx));
    scene.appendChild(el);

    return {
      el, size, idx,
      x: rand(size / 2, W() - size / 2),
      y: initY !== undefined ? initY : rand(-200, -size),
      vy: rand(0.4, 1.1),
      angle: rand(-25, 25),
      vAngle: rand(-0.18, 0.18),
    };
  }

  PHOTOS.forEach((item, i) => {
    flakes.push(createFlake(item, i, rand(-H(), H() * 0.8)));
  });

  function tick() {
    const w = W(), h = H();
    flakes.forEach(f => {
      f.y += f.vy;
      f.angle += f.vAngle;
      f.x += Math.sin(f.y * 0.008) * 0.4;
      if (f.y > h + f.size + 20) {
        f.y = rand(-f.size * 3, -f.size);
        f.x = rand(f.size / 2, w - f.size / 2);
      }
      if (f.x < -f.size) f.x = w + f.size / 2;
      if (f.x > w + f.size) f.x = -f.size / 2;
      f.el.style.transform = `translate(${f.x - f.size / 2}px,${f.y}px) rotate(${f.angle}deg)`;
    });
    rafId = requestAnimationFrame(tick);
  }

  tick();

  modeState.cleanup = () => {
    if (rafId) cancelAnimationFrame(rafId);
  };

  modeState.onResize = () => {
    flakes.forEach(f => { f.x = Math.min(f.x, W() - f.size / 2); });
  };
}

/* ── 柱廊：多柱 3D 绕轴自转 + 惯性拨转 ── */
function renderColonnade() {
  const wrap = document.createElement('div');
  wrap.className = 'colonnade-view';
  const arena = document.createElement('div');
  arena.className = 'colonnade-arena';
  const hint = document.createElement('div');
  hint.className = 'colonnade-hint';
  hint.textContent = '左右拖动拨转 · 自动 360° 旋转';
  wrap.appendChild(arena);
  wrap.appendChild(hint);
  viewport.appendChild(wrap);

  let columns = [];
  let rafId = null;
  let dragMoved = false;
  let dragging = false;
  let pointerId = null;
  let lastPointerX = 0;
  let lastPointerT = 0;
  let velocityRot = 0;

  function columnCount() {
    return Math.max(1, Math.min(5, Math.floor(W() / 160), PHOTOS.length));
  }

  function distributePhotos(count) {
    const buckets = Array.from({ length: count }, () => ({ photos: [], indices: [] }));
    PHOTOS.forEach((photo, i) => {
      const b = buckets[i % count];
      b.photos.push(photo);
      b.indices.push(i);
    });
    return buckets.filter(b => b.photos.length > 0);
  }

  function faceSize(colW, colH, n) {
    const w = Math.min(colW * 0.82, 108);
    const h = Math.min(colH * 0.55, w * 1.15);
    if (n <= 2) return { w: Math.min(w, 120), h: Math.min(h, 140) };
    return { w, h };
  }

  function cylinderRadius(faceW, n) {
    if (n <= 1) return 0;
    return (faceW / 2) / Math.tan(Math.PI / n) + 6;
  }

  function buildCylinder(colEl, items, ci) {
    const n = items.photos.length;
    const colW = colEl.clientWidth || 140;
    const colH = colEl.clientHeight || 400;
    const { w: faceW, h: faceH } = faceSize(colW, colH, n);
    const radius = cylinderRadius(faceW, n);
    const step = n > 0 ? 360 / n : 0;

    const cylinder = document.createElement('div');
    cylinder.className = 'colonnade-cylinder';

    items.photos.forEach((photo, fi) => {
      const face = document.createElement('button');
      face.type = 'button';
      face.className = 'colonnade-face';
      face.style.width = `${faceW}px`;
      face.style.height = `${faceH}px`;
      face.style.marginLeft = `${-faceW / 2}px`;
      face.style.marginTop = `${-faceH / 2}px`;
      const angle = fi * step;
      face.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = photo.title;
      img.loading = 'lazy';
      img.draggable = false;
      face.appendChild(img);

      const idx = items.indices[fi];
      face.addEventListener('click', e => {
        if (dragMoved) { e.preventDefault(); return; }
        openLightbox(idx);
      });
      cylinder.appendChild(face);
    });

    return {
      cylinder,
      rotation: Math.random() * 360,
      speed: (ci % 2 === 0 ? 1 : -1) * (0.12 + (ci % 3) * 0.05),
    };
  }

  function buildColumns() {
    arena.innerHTML = '';
    const buckets = distributePhotos(columnCount());
    columns = buckets.map((items, ci) => {
      const col = document.createElement('div');
      col.className = 'colonnade-column';

      const rod = document.createElement('div');
      rod.className = 'colonnade-rod';
      const capTop = document.createElement('div');
      capTop.className = 'colonnade-rod-cap colonnade-rod-cap--top';
      const capBot = document.createElement('div');
      capBot.className = 'colonnade-rod-cap colonnade-rod-cap--bot';
      col.appendChild(rod);
      col.appendChild(capTop);
      col.appendChild(capBot);

      arena.appendChild(col);
      void col.offsetWidth;
      const state = buildCylinder(col, items, ci);
      col.appendChild(state.cylinder);
      return state;
    });
  }

  function applyTransforms() {
    columns.forEach(col => {
      col.rotation = ((col.rotation % 360) + 360) % 360;
      col.cylinder.style.transform = `rotateY(${col.rotation}deg)`;
    });
  }

  function tick() {
    if (columns.length) {
      if (!dragging) {
        columns.forEach(col => { col.rotation += col.speed; });
        if (Math.abs(velocityRot) > 0.02) {
          columns.forEach(col => { col.rotation += velocityRot; });
          velocityRot *= 0.94;
        } else {
          velocityRot = 0;
        }
      }
      applyTransforms();
    }
    rafId = requestAnimationFrame(tick);
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    dragMoved = false;
    pointerId = e.pointerId;
    lastPointerX = e.clientX;
    lastPointerT = performance.now();
    velocityRot = 0;
    wrap.classList.add('is-dragging');
    wrap.setPointerCapture(pointerId);
  }

  function onPointerMove(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    const dx = e.clientX - lastPointerX;
    const dt = Math.max(performance.now() - lastPointerT, 1);
    if (Math.abs(dx) > 2) dragMoved = true;
    columns.forEach(col => { col.rotation += dx * 0.45; });
    velocityRot = dx / dt * 16 * 0.45;
    lastPointerX = e.clientX;
    lastPointerT = performance.now();
    applyTransforms();
  }

  function endDrag(e) {
    if (!dragging || (e && e.pointerId !== pointerId)) return;
    dragging = false;
    wrap.classList.remove('is-dragging');
    try { wrap.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
  }

  buildColumns();
  applyTransforms();
  rafId = requestAnimationFrame(tick);

  wrap.addEventListener('pointerdown', onPointerDown);
  wrap.addEventListener('pointermove', onPointerMove);
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);
  wrap.addEventListener('lostpointercapture', () => { dragging = false; wrap.classList.remove('is-dragging'); });

  modeState.cleanup = () => {
    if (rafId) cancelAnimationFrame(rafId);
    wrap.removeEventListener('pointerdown', onPointerDown);
    wrap.removeEventListener('pointermove', onPointerMove);
    wrap.removeEventListener('pointerup', endDrag);
    wrap.removeEventListener('pointercancel', endDrag);
  };
  modeState.onResize = () => {
    buildColumns();
    applyTransforms();
  };
}

/* ── 胶片横向滚动 ── */
function renderFilmstrip() {
  const wrap = document.createElement('div');
  wrap.className = 'filmstrip-view';
  const track = document.createElement('div');
  track.className = 'filmstrip-track';
  wrap.appendChild(track);
  viewport.appendChild(wrap);

  PHOTOS.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'filmstrip-item';
    const img = document.createElement('img');
    img.src = item.src;
    img.alt = item.title;
    img.draggable = false;
    const meta = document.createElement('div');
    meta.className = 'filmstrip-meta';
    const strong = document.createElement('strong');
    strong.textContent = item.title;
    meta.appendChild(strong);
    if (item.tag) {
      const span = document.createElement('span');
      span.textContent = item.tag;
      meta.appendChild(span);
    }
    el.appendChild(img);
    el.appendChild(meta);
    el.addEventListener('click', () => openLightbox(i));
    track.appendChild(el);
  });

  modeState.cleanup = null;
  modeState.onResize = null;
}

/* ── 网格平铺 ── */
function renderGrid() {
  const wrap = document.createElement('div');
  wrap.className = 'grid-view';
  const layout = document.createElement('div');
  layout.className = 'grid-layout';
  wrap.appendChild(layout);
  viewport.appendChild(wrap);

  PHOTOS.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'grid-item';
    const img = document.createElement('img');
    img.src = item.src;
    img.alt = item.title;
    img.draggable = false;
    const meta = document.createElement('div');
    meta.className = 'grid-item-meta';
    const strong = document.createElement('strong');
    strong.textContent = item.title;
    meta.appendChild(strong);
    if (item.tag) {
      const span = document.createElement('span');
      span.textContent = item.tag;
      meta.appendChild(span);
    }
    el.appendChild(img);
    el.appendChild(meta);
    el.addEventListener('click', () => openLightbox(i));
    layout.appendChild(el);
  });

  modeState.cleanup = null;
  modeState.onResize = null;
}

/* ══════════════════════════════
   加载图片（从 API）
══════════════════════════════ */
async function loadPhotos() {
  try {
    const res = await fetch(`${API_BASE}/api/photos`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (err) {
    console.error('图片加载失败:', err);
    return [];
  }
}

/* ══════════════════════════════
   灯箱
══════════════════════════════ */
let lbCurrent = 0;

function openLightbox(idx) {
  lbCurrent = idx; showLb();
  const inner = document.querySelector('.lightbox-inner');
  inner.style.transition = 'none';
  inner.style.transform  = 'translateX(0)';
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function showLb() {
  const p = PHOTOS[lbCurrent];
  document.getElementById('lbImg').src = p.src;
  document.getElementById('lbTitle').textContent = p.title + ' ';
  document.getElementById('lbTag').textContent = p.tag ? '· ' + p.tag : '';
  document.getElementById('lbCounter').innerHTML = `<span>${lbCurrent + 1}</span> / ${PHOTOS.length}`;
}

function lbPrev() { lbCurrent = (lbCurrent - 1 + PHOTOS.length) % PHOTOS.length; showLb(); }
function lbNext() { lbCurrent = (lbCurrent + 1) % PHOTOS.length; showLb(); }

document.getElementById('lbClose').onclick = () => closeLightbox();
document.getElementById('lightbox').onclick = e => { if (e.target === document.getElementById('lightbox')) closeLightbox(); };
document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); lbPrev(); };
document.getElementById('lbNext').onclick = e => { e.stopPropagation(); lbNext(); };
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowLeft')   lbPrev();
  if (e.key === 'ArrowRight')  lbNext();
});

/* 触摸滑动（跟随手指 + 切换动画） */
(function () {
  let startX = 0, startY = 0, curX = 0, dragging = false;
  const lb    = document.getElementById('lightbox');
  const inner = lb.querySelector('.lightbox-inner');
  const THRESHOLD = 60;

  function setX(x, animated) {
    inner.style.transition = animated ? 'transform 0.3s cubic-bezier(.25,.8,.25,1)' : 'none';
    inner.style.transform  = `translateX(${x}px)`;
  }

  function slideSwitch(dir) {
    const W = window.innerWidth;
    // 滑出
    setX(dir * -W, true);
    setTimeout(() => {
      if (dir > 0) lbNext(); else lbPrev();
      // 新图片从反方向进入，无动画定位
      setX(dir * W, false);
      // 强制重排后滑回中心
      inner.getBoundingClientRect();
      setX(0, true);
    }, 300);
  }

  lb.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX  = e.touches[0].clientX;
    startY  = e.touches[0].clientY;
    curX    = 0;
    dragging = true;
    setX(0, false);
  }, { passive: true });

  lb.addEventListener('touchmove', e => {
    if (!dragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    // 纵向滑动优先，不拦截
    if (!curX && Math.abs(dy) > Math.abs(dx)) { dragging = false; return; }
    curX = dx;
    // 阻尼：超过阈值后移动变慢
    const damped = Math.abs(dx) > THRESHOLD
      ? THRESHOLD + (Math.abs(dx) - THRESHOLD) * 0.3
      : Math.abs(dx);
    setX(Math.sign(dx) * damped, false);
  }, { passive: true });

  lb.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    if (Math.abs(curX) >= THRESHOLD) {
      slideSwitch(curX > 0 ? -1 : 1);
    } else {
      setX(0, true);
    }
  });
})();

/* ══════════════════════════════
   上传功能
══════════════════════════════ */
let verifiedPassword = '';

// 图片压缩（客户端，控制上传体积）
function compressImage(file, maxWidth = 1200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const ratio = Math.min(maxWidth / img.width, 1);
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 上传 FAB → 打开密码框
document.getElementById('uploadFab').onclick = () => {
  document.getElementById('authPassword').value = '';
  document.getElementById('authError').classList.remove('show');
  document.getElementById('authModal').classList.add('open');
  setTimeout(() => document.getElementById('authPassword').focus(), 80);
};

// 密码验证（调用 /api/auth 提前校验）
document.getElementById('authSubmit').onclick = async () => {
  const pw  = document.getElementById('authPassword').value.trim();
  const err = document.getElementById('authError');
  const btn = document.getElementById('authSubmit');
  if (!pw) return;

  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = '验证中…';

  try {
    const res = await fetch(`${API_BASE}/api/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });

    if (!res.ok) {
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = '验证';
      return;
    }

    verifiedPassword = pw;
    document.getElementById('authModal').classList.remove('open');
    document.getElementById('photoTitle').value = '';
    document.getElementById('photoTag').value   = '';
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('pickerHint').style.display = '';
    document.getElementById('uploadError').classList.remove('show');
    document.getElementById('uploadSuccess').classList.remove('show');
    document.getElementById('uploadModal').classList.add('open');
  } catch {
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = '验证';
  }
};
document.getElementById('authPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authSubmit').click();
});

// 关闭模态框（点击遮罩）
['authModal', 'uploadModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === document.getElementById(id)) {
      document.getElementById(id).classList.remove('open');
    }
  });
});

// 图片预览
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const preview = document.getElementById('previewImg');
  preview.src = url;
  preview.style.display = 'block';
  document.getElementById('pickerHint').style.display = 'none';
});

// 提交上传
document.getElementById('uploadSubmit').onclick = async () => {
  const file  = document.getElementById('fileInput').files[0];
  const title = document.getElementById('photoTitle').value.trim();
  const tag   = document.getElementById('photoTag').value.trim();
  const errEl = document.getElementById('uploadError');
  const sucEl = document.getElementById('uploadSuccess');

  errEl.classList.remove('show');
  sucEl.classList.remove('show');

  if (!file)  { errEl.textContent = '请选择一张图片'; errEl.classList.add('show'); return; }
  if (!title) { errEl.textContent = '请填写标题';   errEl.classList.add('show'); return; }

  const btn = document.getElementById('uploadSubmit');
  btn.disabled = true;
  btn.textContent = '上传中…';

  try {
    const imageData = await compressImage(file);
    const res = await fetch(`${API_BASE}/api/upload`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: verifiedPassword, imageData, title, tag }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '上传失败');

    sucEl.textContent = `「${title}」已上传！`;
    sucEl.classList.add('show');
    btn.textContent = '上传';
    btn.disabled = false;

    // 刷新图片墙
    PHOTOS = await loadPhotos();
    renderGallery();

    setTimeout(() => document.getElementById('uploadModal').classList.remove('open'), 1500);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.textContent = '上传';
    btn.disabled = false;
  }
};

   初始化
══════════════════════════════ */
(async () => {
  PHOTOS = await loadPhotos();
  setModeButtons(currentMode);
  renderGallery();
})();

  if (modeState.onResize) modeState.onResize();
});
