<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery · boomery</title>
  <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080810;
      --accent: #c8ff00;
      --text: #f0f0f0;
      --muted: #555;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'PingFang SC', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 首屏飘落区 ── */
    .gallery-screen {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    #starfield {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    .page-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 24px 40px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(8,8,16,0.95) 60%, transparent);
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .logo span { color: var(--accent); }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    /* ── 雪花飘落场景 ── */
    #scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .flake {
      position: absolute;
      pointer-events: all;
      cursor: pointer;
      will-change: transform;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      transition: box-shadow 0.3s, filter 0.3s;
    }
    .flake:hover {
      box-shadow: 0 0 0 2px var(--accent), 0 8px 40px rgba(200,255,0,0.25);
      filter: brightness(1.15);
      z-index: 50 !important;
    }
    .flake img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* ── 底部渐变遮罩 ── */
    .fade-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to top, var(--bg) 30%, transparent);
      z-index: 10;
      pointer-events: none;
    }

    /* ── 数量统计 ── */
    .counter {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .counter span { color: var(--accent); font-weight: 700; }

    /* ── 向下滚动提示 ── */
    .scroll-hint {
      position: absolute;
      bottom: 14px;
      right: 40px;
      z-index: 20;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      animation: hintBob 2s ease-in-out infinite;
    }
    @keyframes hintBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(4px); }
    }

    /* ── 评论区 ── */
    .comment-section {
      position: relative;
      z-index: 50;
      background: var(--bg);
      padding: 60px 40px 80px;
      max-width: 860px;
      margin: 0 auto;
    }

    .comment-section h2 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e1e1e;
    }
    .comment-section h2 span { color: var(--accent); }

    /* ── 灯箱 ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(16px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 90vw;
      max-height: 90vh;
      animation: lbIn 0.35s cubic-bezier(.22,.68,0,1.2);
    }

    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.85) rotate(-3deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .lightbox-inner img {
      max-width: 88vw;
      max-height: 78vh;
      border-radius: var(--radius);
      display: block;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 14px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .lightbox-caption strong { color: var(--text); margin-right: 8px; }

    .lightbox-close {
      position: absolute;
      top: -16px; right: -16px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-close:hover { background: var(--accent); color: #000; }

    .lightbox-controls {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }

    .lightbox-nav {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.06);
      border: 1px solid #333;
      border-radius: 50%;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .lightbox-nav:hover { background: var(--accent); color: #000; }

    /* ── 上传按钮（悬浮右下角） ── */
    .upload-fab {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 500;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(200,255,0,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .upload-fab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(200,255,0,0.55); }

    /* ── 上传模态框 ── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
    }
    .modal.open { display: flex; }

    .modal-box {
      background: #0f0f1a;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 32px;
      width: min(420px, 92vw);
      animation: lbIn 0.28s cubic-bezier(.22,.68,0,1.2);
    }

    .modal-box h3 {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .modal-box h3 span { color: var(--accent); }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      background: #080810;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); }

    /* 图片预览区 */
    .img-picker {
      width: 100%;
      height: 120px;
      border: 1.5px dashed #2a2a3a;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--muted);
      overflow: hidden;
      transition: border-color 0.2s;
      position: relative;
    }
    .img-picker:hover { border-color: var(--accent); }
    .img-picker img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }
    .img-picker input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn-submit:hover:not(:disabled) { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal-error {
      color: #ff5555;
      font-size: 0.78rem;
      margin-top: 10px;
      display: none;
    }
    .modal-error.show { display: block; }
    .modal-success {
      color: var(--accent);
      font-size: 0.78rem;
      margin-top: 10px;
      display: none;
    }
    .modal-success.show { display: block; }

    @media (max-width: 600px) {
      .page-header { padding: 16px; }
      .comment-section { padding: 40px 16px 60px; }
      .upload-fab { bottom: 20px; right: 20px; }
    }
  </style>
</head>
<body>

<!-- 首屏飘落区 -->
<div class="gallery-screen">
  <canvas id="starfield"></canvas>

  <!-- Header -->
  <div class="page-header">
    <a href="/" class="back-link">← 返回博客</a>
    <div class="logo">Photo<span>Wall</span></div>
  </div>

  <!-- 飘落场景 -->
  <div id="scene"></div>

  <!-- 底部遮罩 -->
  <div class="fade-bottom"></div>

  <!-- 图片数量 -->
  <div class="counter" id="counter"></div>

  <!-- 滚动提示 -->
  <div class="scroll-hint">留言 ↓</div>
</div>

<!-- 评论区 -->
<div class="comment-section">
  <h2>留言 <span>/</span> Comments</h2>
  <div id="waline-comment"></div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lbClose">✕</button>
    <img id="lbImg" src="" alt="" />
    <div class="lightbox-caption">
      <strong id="lbTitle"></strong>
      <span id="lbTag"></span>
    </div>
    <div class="lightbox-controls">
      <button class="lightbox-nav lightbox-prev" id="lbPrev">‹</button>
      <button class="lightbox-nav lightbox-next" id="lbNext">›</button>
    </div>
  </div>
</div>

<!-- 上传悬浮按钮 -->
<button class="upload-fab" id="uploadFab" title="上传图片">＋</button>

<!-- 密码验证模态框 -->
<div class="modal" id="authModal">
  <div class="modal-box">
    <h3><span>/</span> 管理员验证</h3>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="authPassword" placeholder="输入上传密码" autocomplete="off" />
    </div>
    <button class="btn-submit" id="authSubmit">验证</button>
    <div class="modal-error" id="authError">密码错误，请重试</div>
  </div>
</div>

<!-- 上传图片模态框 -->
<div class="modal" id="uploadModal">
  <div class="modal-box">
    <h3><span>/</span> 上传图片</h3>
    <div class="form-group">
      <label>选择图片</label>
      <div class="img-picker" id="imgPicker">
        <span id="pickerHint">点击选择图片</span>
        <img id="previewImg" src="" alt="" style="display:none" />
        <input type="file" id="fileInput" accept="image/*" />
      </div>
    </div>
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="photoTitle" placeholder="给这张图起个名字" maxlength="50" />
    </div>
    <div class="form-group">
      <label>分类标签</label>
      <input type="text" id="photoTag" placeholder="例如：风景、街拍、旅途" maxlength="20" />
    </div>
    <button class="btn-submit" id="uploadSubmit">上传</button>
    <div class="modal-error" id="uploadError"></div>
    <div class="modal-success" id="uploadSuccess">上传成功！</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   配置：部署后将 API_BASE 替换为实际地址
   ═══════════════════════════════════════ */
const API_BASE = 'https://gallery-api.boomery.top';

/* ══════════════════════════════
   星空背景
══════════════════════════════ */
(function () {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  function initStars() {
    stars = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.008,
    }));
  }
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.a = Math.max(0.05, Math.min(0.8, s.a + s.da));
      if (s.a <= 0.05 || s.a >= 0.8) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  resize(); initStars(); drawStars();
  window.addEventListener('resize', () => { resize(); initStars(); });
})();

/* ══════════════════════════════
   雪花飘落引擎
══════════════════════════════ */
const scene = document.getElementById('scene');
let PHOTOS = [];
let flakes = [], rafId = null;

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const rand = (a, b) => a + Math.random() * (b - a);

function createFlake(item, idx, initY) {
  const size   = rand(90, 190);
  const el     = document.createElement('div');
  el.className = 'flake';
  el.style.cssText = `width:${size}px;height:${size}px;z-index:${Math.floor(rand(2,20))}`;

  const img = document.createElement('img');
  img.src = item.src; img.alt = item.title; img.draggable = false;
  el.appendChild(img);
  el.addEventListener('click', () => openLightbox(idx));
  scene.appendChild(el);

  return {
    el, size, idx,
    x: rand(size / 2, W() - size / 2),
    y: initY !== undefined ? initY : rand(-200, -size),
    vy: rand(0.4, 1.1),
    angle: rand(-25, 25),
    vAngle: rand(-0.18, 0.18),
  };
}

function spawnFlakes() {
  if (rafId) cancelAnimationFrame(rafId);
  scene.innerHTML = ''; flakes = [];
  PHOTOS.forEach((item, i) => {
    const copies = Math.ceil(3 + Math.random() * 2);
    for (let c = 0; c < copies; c++) {
      flakes.push(createFlake(item, i, rand(-H(), H() * 0.8)));
    }
  });
}

function tick() {
  const w = W(), h = H();
  flakes.forEach(f => {
    f.y += f.vy;
    f.angle += f.vAngle;
    f.x += Math.sin(f.y * 0.008) * 0.4;
    if (f.y > h + f.size + 20) { f.y = rand(-f.size * 3, -f.size); f.x = rand(f.size/2, w - f.size/2); }
    if (f.x < -f.size) f.x = w + f.size / 2;
    if (f.x > w + f.size) f.x = -f.size / 2;
    f.el.style.transform = `translate(${f.x - f.size/2}px,${f.y}px) rotate(${f.angle}deg)`;
  });
  rafId = requestAnimationFrame(tick);
}

/* ══════════════════════════════
   加载图片（从 API）
══════════════════════════════ */
async function loadPhotos() {
  try {
    const res = await fetch(`${API_BASE}/api/photos`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (err) {
    console.error('图片加载失败:', err);
    return [];
  }
}

/* ══════════════════════════════
   灯箱
══════════════════════════════ */
let lbCurrent = 0;

function openLightbox(idx) {
  lbCurrent = idx; showLb();
  document.getElementById('lightbox').classList.add('open');
}
function showLb() {
  const p = PHOTOS[lbCurrent];
  document.getElementById('lbImg').src = p.src;
  document.getElementById('lbTitle').textContent = p.title + ' ';
  document.getElementById('lbTag').textContent = '· ' + p.tag;
}

document.getElementById('lbClose').onclick = () => document.getElementById('lightbox').classList.remove('open');
document.getElementById('lightbox').onclick = e => { if (e.target === document.getElementById('lightbox')) document.getElementById('lightbox').classList.remove('open'); };
document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); lbCurrent = (lbCurrent - 1 + PHOTOS.length) % PHOTOS.length; showLb(); };
document.getElementById('lbNext').onclick = e => { e.stopPropagation(); lbCurrent = (lbCurrent + 1) % PHOTOS.length; showLb(); };
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
  if (e.key === 'ArrowLeft')  { lbCurrent = (lbCurrent - 1 + PHOTOS.length) % PHOTOS.length; showLb(); }
  if (e.key === 'ArrowRight') { lbCurrent = (lbCurrent + 1) % PHOTOS.length; showLb(); }
});

/* ══════════════════════════════
   上传功能
══════════════════════════════ */
let verifiedPassword = '';

// 图片压缩（客户端，控制上传体积）
function compressImage(file, maxWidth = 1200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const ratio = Math.min(maxWidth / img.width, 1);
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 上传 FAB → 打开密码框
document.getElementById('uploadFab').onclick = () => {
  document.getElementById('authPassword').value = '';
  document.getElementById('authError').classList.remove('show');
  document.getElementById('authModal').classList.add('open');
  setTimeout(() => document.getElementById('authPassword').focus(), 80);
};

// 密码验证（调用 /api/auth 提前校验）
document.getElementById('authSubmit').onclick = async () => {
  const pw  = document.getElementById('authPassword').value.trim();
  const err = document.getElementById('authError');
  const btn = document.getElementById('authSubmit');
  if (!pw) return;

  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = '验证中…';

  try {
    const res = await fetch(`${API_BASE}/api/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });

    if (!res.ok) {
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = '验证';
      return;
    }

    verifiedPassword = pw;
    document.getElementById('authModal').classList.remove('open');
    document.getElementById('photoTitle').value = '';
    document.getElementById('photoTag').value   = '';
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('pickerHint').style.display = '';
    document.getElementById('uploadError').classList.remove('show');
    document.getElementById('uploadSuccess').classList.remove('show');
    document.getElementById('uploadModal').classList.add('open');
  } catch {
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = '验证';
  }
};
document.getElementById('authPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authSubmit').click();
});

// 关闭模态框（点击遮罩）
['authModal', 'uploadModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === document.getElementById(id)) {
      document.getElementById(id).classList.remove('open');
    }
  });
});

// 图片预览
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const preview = document.getElementById('previewImg');
  preview.src = url;
  preview.style.display = 'block';
  document.getElementById('pickerHint').style.display = 'none';
});

// 提交上传
document.getElementById('uploadSubmit').onclick = async () => {
  const file  = document.getElementById('fileInput').files[0];
  const title = document.getElementById('photoTitle').value.trim();
  const tag   = document.getElementById('photoTag').value.trim();
  const errEl = document.getElementById('uploadError');
  const sucEl = document.getElementById('uploadSuccess');

  errEl.classList.remove('show');
  sucEl.classList.remove('show');

  if (!file)  { errEl.textContent = '请选择一张图片'; errEl.classList.add('show'); return; }
  if (!title) { errEl.textContent = '请填写标题';   errEl.classList.add('show'); return; }

  const btn = document.getElementById('uploadSubmit');
  btn.disabled = true;
  btn.textContent = '上传中…';

  try {
    const imageData = await compressImage(file);
    const res = await fetch(`${API_BASE}/api/upload`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: verifiedPassword, imageData, title, tag }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '上传失败');

    sucEl.textContent = `「${title}」已上传！`;
    sucEl.classList.add('show');
    btn.textContent = '上传';
    btn.disabled = false;

    // 刷新图片墙
    PHOTOS = await loadPhotos();
    document.getElementById('counter').innerHTML = `<span>${PHOTOS.length}</span> photos`;
    spawnFlakes();
    tick();

    setTimeout(() => document.getElementById('uploadModal').classList.remove('open'), 1500);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.textContent = '上传';
    btn.disabled = false;
  }
};

  flakes.forEach(f => { f.x = Math.min(f.x, W() - f.size / 2); });
});
