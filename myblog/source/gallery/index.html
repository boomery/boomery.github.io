<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery · boomery</title>
  <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080810;
      --accent: #c8ff00;
      --text: #f0f0f0;
      --muted: #555;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'PingFang SC', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 首屏飘落区 ── */
    .gallery-screen {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    #starfield {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    .page-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 24px 40px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(8,8,16,0.95) 60%, transparent);
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .logo span { color: var(--accent); }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    /* ── 雪花飘落场景 ── */
    #scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .flake {
      position: absolute;
      pointer-events: all;
      cursor: pointer;
      will-change: transform;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      transition: box-shadow 0.3s, filter 0.3s;
    }
    .flake:hover {
      box-shadow: 0 0 0 2px var(--accent), 0 8px 40px rgba(200,255,0,0.25);
      filter: brightness(1.15);
      z-index: 50 !important;
    }
    .flake img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* ── 底部渐变遮罩 ── */
    .fade-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to top, var(--bg) 30%, transparent);
      z-index: 10;
      pointer-events: none;
    }

    /* ── 数量统计 ── */
    .counter {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .counter span { color: var(--accent); font-weight: 700; }

    /* ── 向下滚动提示 ── */
    .scroll-hint {
      position: absolute;
      bottom: 14px;
      right: 40px;
      z-index: 20;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      animation: hintBob 2s ease-in-out infinite;
    }
    @keyframes hintBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(4px); }
    }

    /* ── 评论区 ── */
    .comment-section {
      position: relative;
      z-index: 50;
      background: var(--bg);
      padding: 60px 40px 80px;
      max-width: 860px;
      margin: 0 auto;
    }

    .comment-section h2 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e1e1e;
    }
    .comment-section h2 span { color: var(--accent); }

    /* ── 灯箱 ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(16px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      animation: lbIn 0.35s cubic-bezier(.22,.68,0,1.2);
    }

    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.85) rotate(-3deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .lightbox-inner img {
      max-width: 88vw;
      max-height: 80vh;
      border-radius: var(--radius);
      display: block;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 16px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .lightbox-caption strong { color: var(--text); margin-right: 8px; }

    .lightbox-close {
      position: absolute;
      top: -16px; right: -16px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-close:hover { background: var(--accent); color: #000; }

    .lightbox-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.06);
      border: 1px solid #333;
      border-radius: 50%;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-nav:hover { background: var(--accent); color: #000; }
    .lightbox-prev { left: -58px; }
    .lightbox-next { right: -58px; }

    @media (max-width: 600px) {
      .page-header { padding: 16px; }
      .comment-section { padding: 40px 16px 60px; }
      .lightbox-prev { left: -10px; }
      .lightbox-next { right: -10px; }
    }
  </style>
</head>
<body>

<!-- 首屏飘落区 -->
<div class="gallery-screen">
  <canvas id="starfield"></canvas>

  <!-- Header -->
  <div class="page-header">
    <a href="/" class="back-link">← 返回博客</a>
    <div class="logo">Photo<span>Wall</span></div>
  </div>

  <!-- 飘落场景 -->
  <div id="scene"></div>

  <!-- 底部遮罩 -->
  <div class="fade-bottom"></div>

  <!-- 图片数量 -->
  <div class="counter" id="counter"></div>

  <!-- 滚动提示 -->
  <div class="scroll-hint">留言 ↓</div>
</div>

<!-- 评论区 -->
<div class="comment-section">
  <h2>留言 <span>/</span> Comments</h2>
  <div id="waline-comment"></div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lbClose">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lbPrev">‹</button>
    <button class="lightbox-nav lightbox-next" id="lbNext">›</button>
    <img id="lbImg" src="" alt="" />
    <div class="lightbox-caption">
      <strong id="lbTitle"></strong>
      <span id="lbTag"></span>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════
   ★ 修改这里来更新图片 ★
   格式：{ src: '图片URL', title: '标题', tag: '分类' }
══════════════════════════════ */
const PHOTOS = [
  { src: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600', title: '山间云海', tag: '风景' },
  { src: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500', title: '晨雾森林', tag: '风景' },
  { src: 'https://images.unsplash.com/photo-1519125323398-675f0ddb6308?w=500', title: '街角光影', tag: '街拍' },
  { src: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=600', title: '城市夜景', tag: '建筑' },
  { src: 'https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=500', title: '东京街道', tag: '街拍' },
  { src: 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600', title: '旅途',     tag: '风景' },
  { src: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600', title: '海边黄昏', tag: '风景' },
  { src: 'https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=500', title: '抽象光线', tag: '抽象' },
  { src: 'https://images.unsplash.com/photo-1431440869543-efaf3388c585?w=500', title: '雪山',     tag: '风景' },
  { src: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500', title: '秋色',     tag: '风景' },
];

/* ══════════════════════════════
   星空背景
══════════════════════════════ */
(function () {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  function initStars() {
    stars = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.008,
    }));
  }
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.a = Math.max(0.05, Math.min(0.8, s.a + s.da));
      if (s.a <= 0.05 || s.a >= 0.8) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  resize(); initStars(); drawStars();
  window.addEventListener('resize', () => { resize(); initStars(); });
})();

/* ══════════════════════════════
   雪花飘落引擎
══════════════════════════════ */
const scene = document.getElementById('scene');
let flakes = [], rafId = null;

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const rand = (a, b) => a + Math.random() * (b - a);

function createFlake(item, idx, initY) {
  const size   = rand(90, 190);
  const el     = document.createElement('div');
  el.className = 'flake';
  el.style.cssText = `width:${size}px;height:${size}px;z-index:${Math.floor(rand(2,20))}`;

  const img = document.createElement('img');
  img.src = item.src; img.alt = item.title; img.draggable = false;
  el.appendChild(img);
  el.addEventListener('click', () => openLightbox(idx));
  scene.appendChild(el);

  return {
    el, size, idx,
    x: rand(size / 2, W() - size / 2),
    y: initY !== undefined ? initY : rand(-200, -size),
    vy: rand(0.4, 1.1),
    angle: rand(-25, 25),
    vAngle: rand(-0.18, 0.18),
  };
}

function spawnFlakes() {
  scene.innerHTML = ''; flakes = [];
  PHOTOS.forEach((item, i) => {
    const copies = Math.ceil(3 + Math.random() * 2);
    for (let c = 0; c < copies; c++) {
      flakes.push(createFlake(item, i, rand(-H(), H() * 0.8)));
    }
  });
}

function tick() {
  const w = W(), h = H();
  flakes.forEach(f => {
    f.y += f.vy;
    f.angle += f.vAngle;
    f.x += Math.sin(f.y * 0.008) * 0.4;
    if (f.y > h + f.size + 20) { f.y = rand(-f.size * 3, -f.size); f.x = rand(f.size/2, w - f.size/2); }
    if (f.x < -f.size) f.x = w + f.size / 2;
    if (f.x > w + f.size) f.x = -f.size / 2;
    f.el.style.transform = `translate(${f.x - f.size/2}px,${f.y}px) rotate(${f.angle}deg)`;
  });
  rafId = requestAnimationFrame(tick);
}

/* ══════════════════════════════
   灯箱
══════════════════════════════ */
let lbCurrent = 0;

function openLightbox(idx) {
  lbCurrent = idx; showLb();
  document.getElementById('lightbox').classList.add('open');
}
function showLb() {
  const p = PHOTOS[lbCurrent];
  document.getElementById('lbImg').src = p.src;
  document.getElementById('lbTitle').textContent = p.title + ' ';
  document.getElementById('lbTag').textContent = '· ' + p.tag;
}

document.getElementById('lbClose').onclick = () => document.getElementById('lightbox').classList.remove('open');
document.getElementById('lightbox').onclick = e => { if (e.target === document.getElementById('lightbox')) document.getElementById('lightbox').classList.remove('open'); };
document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); lbCurrent = (lbCurrent - 1 + PHOTOS.length) % PHOTOS.length; showLb(); };
document.getElementById('lbNext').onclick = e => { e.stopPropagation(); lbCurrent = (lbCurrent + 1) % PHOTOS.length; showLb(); };
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
  if (e.key === 'ArrowLeft')  { lbCurrent = (lbCurrent - 1 + PHOTOS.length) % PHOTOS.length; showLb(); }
  if (e.key === 'ArrowRight') { lbCurrent = (lbCurrent + 1) % PHOTOS.length; showLb(); }
});

/* ══════════════════════════════
   初始化
══════════════════════════════ */
document.getElementById('counter').innerHTML = `<span>${PHOTOS.length}</span> photos`;
spawnFlakes();
tick();

window.addEventListener('resize', () => {
  flakes.forEach(f => { f.x = Math.min(f.x, W() - f.size / 2); });
});
</script>

<!-- Waline 评论 -->
<script type="module">
  import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
  init({
    el: '#waline-comment',
    serverURL: 'https://comment.boomery.top',
    lang: 'zh-CN',
    dark: true,
  });
</script>
</body>
</html>
