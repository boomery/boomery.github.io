<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery · boomery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --accent: #c8ff00;
      --text: #f0f0f0;
      --muted: #666;
      --radius: 12px;
      --gap: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'PingFang SC', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    .page-header {
      padding: 60px 40px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .page-header h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .page-header h1 span {
      color: var(--accent);
    }

    .page-header p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 40px 36px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .filter-btn {
      padding: 6px 18px;
      border-radius: 999px;
      border: 1px solid #333;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }

    /* ── Masonry grid ── */
    .masonry {
      columns: 4 280px;
      column-gap: var(--gap);
      padding: 0 40px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      break-inside: avoid;
      margin-bottom: var(--gap);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
      position: relative;
      transition: transform 0.3s cubic-bezier(.22,.68,0,1.2);
    }
    .card:hover { transform: translateY(-4px); }

    .card img {
      width: 100%;
      display: block;
      transition: transform 0.5s ease;
    }
    .card:hover img { transform: scale(1.04); }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 18px;
    }
    .card:hover .card-overlay { opacity: 1; }

    .card-meta { display: flex; flex-direction: column; gap: 4px; }
    .card-title { font-size: 0.9rem; font-weight: 600; color: #fff; }
    .card-tag {
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      animation: lbIn 0.3s cubic-bezier(.22,.68,0,1.2);
    }

    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    .lightbox-inner img {
      max-width: 90vw;
      max-height: 82vh;
      border-radius: var(--radius);
      display: block;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }
    .lightbox-caption strong { color: var(--text); }

    .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-close:hover { background: var(--accent); color: #000; }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.08);
      border: 1px solid #444;
      border-radius: 50%;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-nav:hover { background: var(--accent); color: #000; }
    .lightbox-prev { left: -54px; }
    .lightbox-next { right: -54px; }

    /* ── Upload zone ── */
    .upload-zone {
      margin: 0 40px 40px;
      max-width: 1400px;
      border: 2px dashed #333;
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
    }
    .upload-zone p { color: var(--muted); font-size: 0.88rem; }
    .upload-zone p span { color: var(--accent); }
    #fileInput { display: none; }

    /* ── Empty state ── */
    .empty-hint {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
      display: none;
    }

    @media (max-width: 600px) {
      .page-header, .filter-bar, .masonry { padding-left: 16px; padding-right: 16px; }
      .masonry { columns: 2 140px; }
      .lightbox-prev { left: -10px; }
      .lightbox-next { right: -10px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <a href="/" class="back-link">← 返回博客</a>
  <h1>Photo<span>Wall</span></h1>
  <p>GALLERY · MOMENTS · AESTHETICS</p>
</div>

<!-- 筛选标签 -->
<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-tag="all">All</button>
</div>

<!-- 上传区域 -->
<div class="upload-zone" id="uploadZone">
  <input type="file" id="fileInput" accept="image/*" multiple />
  <p>点击或拖拽图片到此处上传 &nbsp;·&nbsp; <span>支持 JPG / PNG / WEBP / GIF</span></p>
</div>

<!-- 瀑布流 -->
<div class="masonry" id="masonry"></div>
<div class="empty-hint" id="emptyHint">还没有图片，上传第一张吧 ↑</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner" id="lightboxInner">
    <button class="lightbox-close" id="lbClose">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lbPrev">‹</button>
    <button class="lightbox-nav lightbox-next" id="lbNext">›</button>
    <img id="lbImg" src="" alt="" />
    <div class="lightbox-caption">
      <strong id="lbTitle"></strong>
      <span id="lbTag"></span>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'boomery_gallery_v1';
  const TAG_COLORS  = ['风景','人像','建筑','街拍','抽象','其他'];

  let items   = [];
  let current = 0;
  let activeTag = 'all';

  // ── 持久化 ──
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
  }
  function load() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) items = JSON.parse(d);
    } catch(e) { items = []; }
  }

  // ── 上传 ──
  const uploadZone = document.getElementById('uploadZone');
  const fileInput  = document.getElementById('fileInput');

  uploadZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  uploadZone.addEventListener('dragover', e => {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files) {
    [...files].forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const tag = TAG_COLORS[Math.floor(Math.random() * TAG_COLORS.length)];
        items.unshift({ src: ev.target.result, title: file.name.replace(/\.[^.]+$/, ''), tag });
        save();
        render();
      };
      reader.readAsDataURL(file);
    });
  }

  // ── 渲染瀑布流 ──
  function render() {
    const masonry   = document.getElementById('masonry');
    const emptyHint = document.getElementById('emptyHint');
    const filtered  = activeTag === 'all' ? items : items.filter(i => i.tag === activeTag);

    masonry.innerHTML = '';
    emptyHint.style.display = filtered.length === 0 ? 'block' : 'none';

    filtered.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${item.src}" alt="${item.title}" loading="lazy" />
        <div class="card-overlay">
          <div class="card-meta">
            <span class="card-title">${item.title}</span>
            <span class="card-tag">${item.tag}</span>
          </div>
        </div>`;
      card.addEventListener('click', () => openLightbox(idx, filtered));
      masonry.appendChild(card);
    });

    buildFilterBar();
  }

  // ── 筛选标签 ──
  function buildFilterBar() {
    const bar  = document.getElementById('filterBar');
    const tags = ['all', ...new Set(items.map(i => i.tag))];
    bar.innerHTML = '';
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (tag === activeTag ? ' active' : '');
      btn.dataset.tag = tag;
      btn.textContent = tag === 'all' ? 'All' : tag;
      btn.addEventListener('click', () => { activeTag = tag; render(); });
      bar.appendChild(btn);
    });
  }

  // ── 灯箱 ──
  let lbItems = [];
  function openLightbox(idx, filtered) {
    lbItems  = filtered;
    current  = idx;
    showLb();
    document.getElementById('lightbox').classList.add('open');
  }

  function showLb() {
    const item = lbItems[current];
    document.getElementById('lbImg').src    = item.src;
    document.getElementById('lbTitle').textContent = item.title + ' ';
    document.getElementById('lbTag').textContent   = '· ' + item.tag;
  }

  document.getElementById('lbClose').addEventListener('click', () =>
    document.getElementById('lightbox').classList.remove('open'));
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox'))
      document.getElementById('lightbox').classList.remove('open');
  });
  document.getElementById('lbPrev').addEventListener('click', e => {
    e.stopPropagation();
    current = (current - 1 + lbItems.length) % lbItems.length;
    showLb();
  });
  document.getElementById('lbNext').addEventListener('click', e => {
    e.stopPropagation();
    current = (current + 1) % lbItems.length;
    showLb();
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape')      document.getElementById('lightbox').classList.remove('open');
    if (e.key === 'ArrowLeft')  { current = (current - 1 + lbItems.length) % lbItems.length; showLb(); }
    if (e.key === 'ArrowRight') { current = (current + 1) % lbItems.length; showLb(); }
  });

  // ── 初始化 ──
  load();
  if (items.length === 0) {
    // 预置几张演示图（Unsplash）
    const demos = [
      { src: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800', title: '山间云海', tag: '风景' },
      { src: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600', title: '晨雾森林', tag: '风景' },
      { src: 'https://images.unsplash.com/photo-1519125323398-675f0ddb6308?w=600', title: '街角光影', tag: '街拍' },
      { src: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800', title: '城市夜景', tag: '建筑' },
      { src: 'https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=600', title: '东京街道', tag: '街拍' },
      { src: 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800', title: '旅途', tag: '风景' },
      { src: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800', title: '海边黄昏', tag: '风景' },
      { src: 'https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=600', title: '抽象光线', tag: '抽象' },
    ];
    items = demos;
  }
  render();
</script>
</body>
</html>
